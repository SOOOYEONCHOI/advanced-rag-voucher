version: '3.8'

services:
  backend:
    build:
      context: ./adrag_backend
      dockerfile: Dockerfile
    image: adrag_backend:latest
    container_name: adrag_backend
    ports:
      - "127.0.0.1:8081:8081"
    env_file:
      - .env
    environment:
      - TZ=Asia/Seoul
      - DOCLING_PARSER_HOST=${DOCLING_PARSER_HOST}
      - DOCLING_API_KEY=${DOCLING_API_KEY}
      # excel resource backend 저장
      - RESOURCE_STORAGE_ROOT=${RESOURCE_STORAGE_ROOT}
      - RESOURCE_INTERNAL_API_KEY=${RESOURCE_INTERNAL_API_KEY}
      # 파서가 resource를 회신할 이 백엔드 주소
      - BACKEND_CALLBACK_URL=${BACKEND_CALLBACK_URL}
      - RESOURCE_DELIVERY=${RESOURCE_DELIVERY:-pull}
      - RESOURCE_MAX_UPLOAD_BYTES=${RESOURCE_MAX_UPLOAD_BYTES}
      - RESOURCE_STAGING_TTL_HOURS=${RESOURCE_STAGING_TTL_HOURS}
      - LOG_LEVEL=${LOG_LEVEL}
      - LOG_RETENTION_DAYS=${LOG_RETENTION_DAYS}
      - LOG_ERROR_RETENTION_DAYS=${LOG_ERROR_RETENTION_DAYS}
      
      - EMBEDDING_API_URL=${EMBEDDING_API_URL}
      - EMBEDDING_MODEL_NAME=${EMBEDDING_MODEL_NAME}
      - EMBEDDING_DIM=${EMBEDDING_DIM}
      - EMBEDDING_API_KEY=${EMBEDDING_API_KEY}
      
      - VLLM_API_URL=${VLLM_API_URL}
      - VLLM_MODEL_NAME=${VLLM_MODEL_NAME}
      - VLLM_API_KEY=${VLLM_API_KEY}
      
      - ENABLE_RERANKING=${ENABLE_RERANKING}
      - RERANKER_API_URL=${RERANKER_API_URL}
      - RERANKER_API_KEY=${RERANKER_API_KEY}
      - RERANKER_MODEL_NAME=${RERANKER_MODEL_NAME}
      
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      
      # 2026.09.29 수정 - 파일 DB → PostgreSQL 16.14 (compose 내부 서비스명으로 오버라이드)
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - JWT_ALGORITHM=${JWT_ALGORITHM}
      - CORS_ORIGINS=${CORS_ORIGINS}
      
      - MAX_CHUNK_SIZE=${MAX_CHUNK_SIZE}
      - CHUNK_OVERLAP=${CHUNK_OVERLAP}
      - TOP_K_RESULTS=${TOP_K_RESULTS}
      
    user: root
    volumes:
      - ./adrag_backend:/app
      - /opt/venv
      - ${HF_CACHE_DIR:-/mnt/huggingface-cache}:/root/.cache/huggingface
      
    networks:
      - rag-network
      
    depends_on:
      qdrant:
        condition: service_started
      postgres:
        condition: service_healthy
    restart: always

    deploy:
      resources:
        limits:
          memory: 8G
          
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  qdrant:
    image: qdrant/qdrant:v1.18.2
    container_name: rag-qdrant
    ports:
      - "6333:6333"
    volumes:
      - qdrant-storage:/qdrant/storage
    networks:
      - rag-network
    restart: always
    deploy:
      resources:
        limits:
          memory: 4G

  # 2026.09.29 추가 - PostgreSQL 16.14 (호스트 포트는 열지 않음)
  postgres:
    image: postgres:16.14
    container_name: rag-postgres
    environment:
      - TZ=Asia/Seoul
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - rag-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: always
    deploy:
      resources:
        limits:
          memory: 2G

networks:
  rag-network:
    driver: bridge

volumes:
  qdrant-storage:
    driver: local
  postgres-data:
    driver: local
