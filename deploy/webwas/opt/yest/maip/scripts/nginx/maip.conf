# 제조AI플랫폼 nginx — NCP ALB 뒤에서 평문 80 을 받아 앱(gunicorn 127.0.0.1:8080)으로 넘긴다. 설명: docs/DEPLOYMENT.md §4
# /etc/nginx/conf.d/maip.conf 로 복사한다. 00-default.conf(기본 server·$forwarded_proto)가 함께 있어야 한다.
# 경로(/mnt/a/maip/...)는 .env 의 STORAGE_ROOT/media · DISTRIBUTION_ROOT 와 같아야 한다.

server {
    listen 80;
    listen [::]:80;
    # .env ALLOWED_HOSTS 와 같게. ALB 주소는 옛 주소로 받는 Client 를 모두 바꾼 뒤 뺀다(DEPLOYMENT §5)
    server_name maip-web.yest.co.kr yest-alb-110024146-71a00b312785.kr-gov.lb.naverncp.com;

    client_max_body_size 40m;   # 업로드 한 요청 합계(DEPLOYMENT §4 "업로드 크기")
    server_tokens off;

    # ALB 가 넘긴 X-Forwarded-For 에서 실제 접속 주소를 꺼낸다 — ALB 대역에서 온 값만 믿는다.
    # 빠지면 모든 사용자가 ALB 주소 하나로 보여 로그인 잠금이 한 사람의 실패로 모두를 막는다. ALB 노드는 10.0.0.7·10.0.0.8
    set_real_ip_from 10.0.0.0/16;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_read_timeout 120s;   # gunicorn --timeout 120(maip.service)과 맞춘다. nginx 기본은 60초
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;   # realip 뒤라 실제 사용자 주소. 로그인 잠금이 이 값으로 센다
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;   # $scheme(늘 http)이면 HTTPS_ENABLED 에서 무한 리다이렉트
    }

    # 학습 플랫폼 스냅샷 API 는 Wezard 서버(GPU)에만 연다. Wezard 는 ALB 를 거치지 않고 이 서버 80 으로 바로 온다
    # (GPU /etc/hosts 에 "10.0.10.6 maip-web.yest.co.kr"). realip 가 ALB 대역만 믿어 X-Forwarded-For 로 이 주소를 꾸밀 수 없다
    location /api/v1/datasets/ {
        allow 172.16.10.6;
        deny all;
        proxy_pass http://127.0.0.1:8080;
        proxy_read_timeout 120s;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;   # 직접 온 평문 요청이 HTTPS_ENABLED 에서 https 로 301 되지 않게(내부망). 이 API 는 절대 URL 을 만들지 않는다
    }

    # FILE_ACCEL_REDIRECT=True 일 때 Django 가 권한을 확인한 뒤 넘기는 경로. internal 이라 브라우저가 직접 열 수 없다
    location /_protected/media/ {
        internal;
        alias /mnt/a/maip/data/media/;
    }
    location /_protected/distribution/ {
        internal;
        alias /mnt/a/maip/distribution/;
        max_ranges 1;   # 계약 §10-2: 다중 범위는 206 multipart 가 아니라 200 전체
    }
}
