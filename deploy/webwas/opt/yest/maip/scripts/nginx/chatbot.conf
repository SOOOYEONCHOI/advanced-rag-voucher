# Chatbot — chatbot.yest.co.kr 을 이 서버 127.0.0.1:8081 로 넘긴다. /etc/nginx/conf.d/chatbot.conf 로 복사한다(00-default.conf 필요)
# 서비스가 뜨기 전에는 502 다. 업로드·응답 시간 한도는 Chatbot 에 맞춰 고친다
server {
    listen 80;
    listen [::]:80;
    server_name chatbot.yest.co.kr;
    server_tokens off;

    set_real_ip_from 10.0.0.0/16;   # ALB 대역만 믿는다(maip.conf 와 같다)
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    location / {
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }
}
