{% extends "app/layout_page.html" %}
{% load static %}
{% block css %}
<link rel="stylesheet" href="{% static 'assets/vendor/daterangepicker/daterangepicker.css' %}" type="text/css" />
{% endblock %}

{% block content %}
<div class="card">
    <div class="d-flex card-header justify-content-between align-items-center">
        <h4 class="header-title">
            <span data-labelCd="{{ gui.gui_name }}">{{ gui.gui_name }}</span>
            <a href="javascript:void(0);"><i class="uil uil-favorite favorite-on"></i></a>
        </h4>
    </div>
    <div class="collapse show" id="userSearchCollapse">
        <div class="card-body">
            <form id="searchForm">
                <div class="row">
                    <div class="col-12 col-sm-6 col-lg-4 col-xl-4 col-xxl-3">
                        <div class="d-flex align-items-center">
                            <label for="daterange" class="form-label" data-labelCd="발생일">발생일</label>
                            <input type="hidden" id="date_from" name="date_from" />
                            <input type="hidden" id="date_to" name="date_to" />
                            <input type="text" class="form-control date" id="daterange" data-toggle="date-picker" data-cancel-class="btn-warning" style="width: 260px;" />
                        </div>
                    </div>
                    <div class="col-12 col-sm-6 col-lg-4 col-xl-4 col-xxl-3">
                        <div class="d-flex align-items-center">
                            <label for="cboMenu" class="form-label" data-labelCd="메뉴">메뉴</label>
                            <select class="form-select" id="cboMenu" name="cboMenu"></select>
                        </div>
                    </div>
                    <div class="col-12 col-sm-6 col-lg-4 col-xl-4 col-xxl-3">
                        <div class="d-flex align-items-center justify-content-between">
                            <label for="cboUser" class="form-label" data-labelCd="사용자">사용자</label>
                            <select class="form-select" id="cboUser" name="cboUser"></select>
                            <button type="button" class="col-auto-flex btn btn-search" id="btnSearch" data-commonCd="조회">조회</button>
                        </div>
                    </div>
                </div>
            </form>
        </div>
    </div>
    <div class="floder-close">
        <a class="text-dark" data-bs-toggle="collapse" href="#userSearchCollapse" role="button" aria-expanded="true" aria-controls="userSearchCollapse">
            <i class="uil uil-angle-down"></i>
        </a>
    </div>
</div>

<div class="card mb-0 mt-2 p-15">
    <div class="tabs" data-tab="tabWrap">
        <ul class="tab_links nav nav-tabs nav-bordered mb-2">
            <li class="nav-item"><a href="#tab_count" data-bs-toggle="tab" data-tablink="#tab_count" class="tab nav-link active" data-labelCd="메뉴별 사용 횟수">메뉴별 사용 횟수</a></li>
            <li class="nav-item"><a href="#tab_log" data-bs-toggle="tab" data-tablink="#tab_log" class="tab nav-link" data-labelCd="사용 기록">사용 기록</a></li>
        </ul>

        <div class="tab-content">
            <div class="tab-pane active" id="tab_count">
                <div class="d-flex justify-content-between align-items-center upper-wezongrid">
                    <div class="sub-tit">
                        <span class="right_align rpt" data-labelCd="메뉴별 사용 횟수">메뉴별 사용 횟수</span>
                    </div>
                </div>
                <div id="count-grid"></div>
            </div>

            <div class="tab-pane" id="tab_log">
                <div class="d-flex justify-content-between align-items-center upper-wezongrid">
                    <div class="sub-tit">
                        <span class="right_align rpt" data-labelCd="사용 기록">사용 기록</span>
                    </div>
                </div>
                <div id="log-grid"></div>
            </div>
        </div>
    </div>
</div>

{% endblock %}

{% block scripts %}
{% include '../common/columns_setting.html' %}
<script type="text/javascript">
    
    class MenuLogPage {
        constructor() {
            this.grid = null;
            this.count_grid = null;
            this.params = null;     // 마지막 [조회] 조건. 페이지 이동이 같은 조건을 쓴다
            this.init();
        }

        init() {
            let _this = this;
            // 로그는 쌓이기만 한다. 서버에서 50건씩, 최신순 고정이라 헤더 정렬을 끈다. [조회] 전에는 받지 않는다(params null).
            const source = AjaxUtil.gridRemoteSource('/api/system/menulog?action=log_list', function () { return _this.params; });

            _this.grid = WeZonGrid.create('#log-grid', {
                columnLayout: [
                    { dataField: 'id', headerText: 'No', width: 70, align: 'center' }
                    , { dataField: 'folder_name', headerText: '메뉴폴더', width: 100, align: 'left' }
                    , { dataField: 'menu_name', headerText: '메뉴', width: 100, align: 'left' }
                    , { dataField: 'username', headerText: '아이디', width: 150, align: 'left' }
                    , { dataField: 'user_name', headerText: '이름', width: 150, align: 'left' }
                    , { dataField: 'click_date', headerText: '일시', width: 150, align: 'center' }
                ]
                , props: { height: 540, enableSorting: false, selectionMode: 'singleRow', dataMode: 'server', rowIdField: 'id', remoteDataSource: source, enablePaging: true, pageSize: 50, pageSizeOptions: [50, 100, 200] }
            });
            GridUtil.fitWidth(_this.grid);

            _this.count_grid = WeZonGrid.create('#count-grid', {
                columnLayout: [
                    { dataField: 'folder_name', headerText: '메뉴폴더', width: 100, align: 'left' }
                    , { dataField: 'menu_name', headerText: '메뉴', width: 100, align: 'left' }
                    , { dataField: 'use_count', headerText: '사용 횟수', width: 150, align: 'right', labelFunction: function(rowIndex, columnIndex, value, headerText, item) { return value ? CommonUtil.CommaNumber(value) : '0'; } }
                ]
                , props: { height: 540, enableSorting: true, enablePaging: true, selectionMode: 'singleRow' }
            });
            GridUtil.fitWidth(_this.count_grid);
        }

        searchDataBind() {
            let _this = this;
            let param = FormUtil.extractForm($('#searchForm'));
            let url = '/api/system/menulog?action=log_count';

            // 두 조회는 서로 의존하지 않는다. 순차로 묶지 않고 함께 보낸다.
            AjaxUtil.getAsyncData(url, param, function (result) {
                if (result != null) {
                    _this.count_grid.setData(result);
                }
            });

            _this.params = param;
            AjaxUtil.gridResearch(_this.grid);
        }//searchDataBind

    }
    var page = null;
    $(document).ready(function (e) {
        page = new MenuLogPage();

        let startDate = moment().add(-7, 'days');
        let endDate = moment();
        $('#daterange').daterangepicker({
            startDate: startDate,
            endDate: endDate,
            locale: {
                format: 'YYYY-MM-DD'
            }
        }, function(start, end, label) {
            $('#date_from').val(start.format('YYYY-MM-DD'));
            $('#date_to').val(end.format('YYYY-MM-DD'));
        });
        $('#date_from').val(startDate.format('YYYY-MM-DD'));
        $('#date_to').val(endDate.format('YYYY-MM-DD'));

        AjaxUtil.fillSelectOptions($('#cboMenu'), 'menu_item', 'all');

        let url = '/api/system/menulog?action=user_list';
        AjaxUtil.getAsyncData(url, {}, function (user_list) {
            let $combo = $('#cboUser');
            $combo.empty();
            let option = $('<option>',
                {
                    value: '',
                    text: '전체',
                });
            $combo.append(option);
            $.each(user_list, function (index, row) {
                let option = $('<option>',
                    {
                        value: row['value'],
                        text: row['text'],
                    });
                $combo.append(option);
            });

            page.popColSetting = new popColSetting();
            page.popColSetting.loadColumnData(gui.gui_code, gui.template_key, 'grid1', page.count_grid);
            page.popColSetting.loadColumnData(gui.gui_code, gui.template_key, 'grid2', page.grid);
        
        
            $('.nav-tabs .nav-link').on('shown.bs.tab', function (e) {
            let target = ($(e.target).attr('href') || '').replace('#', '');
            if (target == 'tab_count') {
            setTimeout(function () { page.count_grid.resize(); }, 300);
            } else if (target == 'tab_log') {
            setTimeout(function () { page.grid.resize(); }, 300);
            }
            });

            page.searchDataBind();

            $('#btnSearch').click(function (ex) {
                page.searchDataBind();
            });

        });
    });
</script>


{% endblock %}
