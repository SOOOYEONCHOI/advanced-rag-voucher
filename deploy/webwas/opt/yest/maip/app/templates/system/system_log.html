{% extends "app/layout_page.html" %}
{% load static %}
{% block css %}
<link rel="stylesheet" href="{% static 'assets/vendor/daterangepicker/daterangepicker.css' %}" type="text/css" />
{% endblock %}

{% block content %}
<div class="card">
    <div class="d-flex card-header justify-content-between align-items-center">
        <h4 class="header-title"><span data-labelCd="{{ gui.gui_name }}">{{ gui.gui_name }}</span>
            <a href="javascript:void(0);"><i class="uil uil-favorite favorite-on"></i></a>
        </h4>
    </div>
    <div class="collapse show" id="userSearchCollapse">
        <div class="card-body">
            <form id="searchForm" autocomplete="off">
                <div class="row">
                    <div class="col-12 col-sm-6 col-lg-4 col-xl-4 col-xxl-3">
                        <div class="d-flex align-items-center justify-content-between">
                            <label for="daterange" class="form-label" data-labelCd="발생일">발생일</label>
                            <input type="text" class="form-control date" id="daterange" data-toggle="date-picker" data-cancel-class="btn-warning">
                            <input type="hidden" id="srchStartDt" name="srchStartDt" />
                            <input type="hidden" id="srchEndDt" name="srchEndDt" />
                        </div>
                    </div>

                    <div class="col-12 col-sm-6 col-lg-4 col-xl-4 col-xxl-3">
                        <div class="d-flex align-items-center justify-content-between">
                            <label for="srchType" class="form-label" data-commonCd="구분">구분</label>
                            <input class="form-control" id="srchType" name="srchType" />
                        </div>
                    </div>

                    <div class="col-12 col-sm-6 col-lg-4 col-xl-4 col-xxl-3">
                        <div class="d-flex align-items-center justify-content-between">
                            <label for="srchSource" class="form-label" data-labelCd="오류 위치">오류 위치</label>
                            <input class="form-control" id="srchSource" name="srchSource" />
                            <button type="button" class="col-auto-flex btn btn-search" id="btnSearch" data-commonCd="조회">조회</button>
                        </div>
                    </div>
                </div>
            </form>
        </div>
    </div>
    <div class="floder-close">
        <a class="text-dark" data-bs-toggle="collapse" href="#userSearchCollapse" role="button" aria-expanded="true" aria-controls="userSearchCollapse">
            <i class="uil uil-angle-down"></i>
        </a>
    </div>
</div>

<div class="d-flex justify-content-between align-items-center upper-wezongrid">
    <div class="sub-project-tit">
        <span class="right_align rpt" data-labelCd="시스템 로그 내역">시스템 로그 내역</span>
    </div>
</div>
<div id="log-grid"></div>

<div class="card mb-0 mt-2 p-15">
    <div class="d-flex justify-content-between align-items-center mb-2">
        <div class="sub-project-tit">
            <span class="right_align rpt" data-labelCd="시스템 로그 상세 정보">시스템 로그 상세 정보</span>
        </div>
    </div>
    <form id="systemlogForm">
        <input type="hidden" id="id" name="id" />
        <div class="row">
            <div class="col-xl-4 col-sm-6 col-lg-12">
                <div class="d-flex align-items-center">
                    <label for="type" class="form-label" data-commonCd="구분">구분</label>
                    <input class="form-control" type="text" id="type" name="type" disabled readonly required />
                </div>
            </div>

            <div class="col-xl-4 col-sm-6 col-lg-12">
                <div class="d-flex align-items-center">
                    <label for="source" class="form-label" data-labelCd="오류 위치">오류 위치</label>
                    <input class="form-control" type="text" id="source" name="source" disabled required />
                </div>
            </div>

            <div class="col-xl-4 col-sm-6 col-lg-12">
                <div class="d-flex align-items-center">
                    <label for="created" class="form-label" data-labelCd="발생일">발생일</label>
                    <input class="form-control" type="text" id="created" name="created" disabled />
                </div>
            </div>

            <div class="col-12">
                <div class="d-flex align-items-center">
                    <label for="message" class="form-label" data-labelCd="오류 내용">오류 내용</label>
                    <textarea class="form-control" id="message" name="message" rows="5" disabled></textarea>
                </div>
            </div>
        </div>
    </form>
</div>

{% endblock %}

{% block scripts %}
{% include '../common/columns_setting.html' %}
<script type="text/javascript">


    class SystemLogPage {
        constructor() {
            this.grid = null;
            this.params = null;     // 마지막 [조회] 조건. 페이지 이동·엑셀이 같은 조건을 쓴다
            this.init();
        }

        init() {
            let _this = this;
            // 로그는 쌓이기만 한다. 서버에서 50건씩, 최신순 고정이라 헤더 정렬을 끈다. [조회] 전에는 받지 않는다(params null).
            const source = AjaxUtil.gridRemoteSource('/api/system/systemlog', function () { return _this.params; });

            _this.grid = WeZonGrid.create('#log-grid', {
                columnLayout: [
                    { dataField: 'id', headerText: 'No', width: 70, align: 'center' }
                    , { dataField: 'type', headerText: '구분', width: 100, align: 'center' }
                    , { dataField: 'source', headerText: '오류 위치', width: 250, align: 'left' }
                    , { dataField: 'message', headerText: '오류 내용', width: 350, align: 'left' }
                    , { dataField: 'created', headerText: '발생일', width: 150, align: 'center' }
                ]
                , props: { height: 500, enableSorting: false, selectionMode: 'singleRow', dataMode: 'server', rowIdField: 'id', remoteDataSource: source, enablePaging: true, pageSize: 50, pageSizeOptions: [50, 100, 200] }
            });
            GridUtil.fitWidth(_this.grid);

            _this.grid.on('cellClick', function(e) {
                _this.showDetailLog(e.item.id);
            });

            $('#srchStartDt').val(CommonUtil.getYYYYMMDD());
            $('#srchEndDt').val(CommonUtil.getYYYYMMDD());

        }

        showDetailLog(idx) {
            let param = { 'log_id': idx, "action": 'detail' };
            let url = '/api/system/systemlog';
            AjaxUtil.getAsyncData(url, param, function (result) {
                if (result != null) {
                    FormUtil.BindDataForm(result, $('#systemlogForm'));
                    // BindDataForm 이 disabled 를 푼다 — 로그는 읽기 전용이다
                    $('#systemlogForm').find('input, textarea').prop('disabled', true);
                }
            });
        }

        searchDataBind() {
            let _this = this;
            let datePicker = $('#daterange').data('daterangepicker');
            if (datePicker) {
                $('#srchStartDt').val(datePicker.startDate.format('YYYY-MM-DD'));
                $('#srchEndDt').val(datePicker.endDate.format('YYYY-MM-DD'));
            }
            _this.params = FormUtil.extractForm($('#searchForm'));
            AjaxUtil.gridResearch(_this.grid);
        }//searchDataBind




    }
    var page = null;
    $(document).ready(function (e) {
        page = new SystemLogPage();

        $('#daterange').daterangepicker({
            opens: 'left',
            startDate: moment(),
            endDate: moment(),
            locale: {
                format: 'YYYY-MM-DD'
            }
        });

        let datePicker = $('#daterange').data('daterangepicker');
        if (datePicker) {
            $('#srchStartDt').val(datePicker.startDate.format('YYYY-MM-DD'));
            $('#srchEndDt').val(datePicker.endDate.format('YYYY-MM-DD'));
        }

        page.popColSetting = new popColSetting();
        page.popColSetting.loadColumnData(gui.gui_code, gui.template_key, 'grid', page.grid);

        page.searchDataBind();

        $('#btnSearch').click(function (ex) {
            page.searchDataBind();
        });




    });
</script>


{% endblock %}
