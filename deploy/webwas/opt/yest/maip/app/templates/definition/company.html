        setButtonState() {
            let pk = $('#basicForm').find('#id').val();
            $('#btnNew').prop('disabled', false);
            $('#btnSave').prop('disabled', false);
            if (pk) {
                $('#btnDelete').prop('disabled', false);
            }
            else {
                $('#btnDelete').prop('disabled', true);
            }
        }

        showDetail(idx) {
            let a = $("#company_type").val()

            let param = { 'id': idx, "action": 'detail' };
            let url = '/api/definition/company';
            AjaxUtil.getAsyncData(url, param, function (result) {
                if (result != null) {

                    FormUtil.BindDataForm(result, $('#basicForm'));
                    FormUtil.BindDataForm(result, $('#manageForm'));

                    let tmp = [];

                    $.each(result.company_type, function (idx, item) {
                        tmp.push(item.company_type);
                    });

                    $('#company_type').val(tmp);
                    $('#company_type').select2();
                }

                page.setButtonState();
            });
        }

            let _this = this;

                    }
                });

                $('#company_type').select2();

                page.setButtonState();
                //page.setButtonDisable2(true, true, true);
            });
        }

        saveData() {
            let _this = this;
            let url = '/api/definition/company?action=save';

            let comp_type = $('#company_type').val() == null ? '' : $('#company_type').val().join(';');
            let data1 = FormUtil.extractForm($('#basicForm'));
            let data2 = FormUtil.extractForm($('#manageForm'));

            data1['company_type'] = comp_type;
            let data = $.extend({}, data1, data2);

            let fnSuccess = function (res) {
                if (res.success) {
                    Notify.success('저장되었습니다');
                    _this.searchMainData1();
                } else {
                    Alert.alert('', res.message);
                }
            };

            //let company_types = '';

            //$('#company_type').val().forEach(function (value, idx) {
            //    company_types += value + ';' ;
            //});

            AjaxUtil.postAsyncData(url, data, fnSuccess);
        }


        deleteData() {
            let _this = this;
            let url = '/api/definition/company?action=delete';
            let id = $('#basicForm').find('#id').val()
            let data = { id: id };
            let fnSuccess = function (res) {
                if (res.success) {
                    Notify.success('삭제되었습니다');
                    _this.searchMainData1();
                } else {
                    Alert.alert('', res.message);
                }
            }

            AjaxUtil.postAsyncData(url, data, fnSuccess);

            //page.setButtonDisable1(false, true, true);
            page.setButtonState();
        }

    }

    let page = null;

    $(document).ready(function (e) {
        page = new CompanyPage();

        AjaxUtil.fillSelectOptions($('#cboCompanyType'), 'system_code', 'choose', false, 'company_type');

        AjaxUtil.fillSelectOptions($('#company_type'), 'system_code', '', false, 'company_type');



        $('#company_type').select2({
            tags: true,
            placeholder: '업체구분을 선택해주세요.'
        });

        $('#btnSearch').click(function (ex) {
            page.searchMainData1();
        });

        // 엔터키 검색
        $('#txtCompany').on('keypress', function (e) {
            if (event.keyCode == 13) {
                event.preventDefault();
                page.searchMainData1();
            }
        });

        $('.tab_links .tab').click(function (e) {
            console.log('tab id', e.currentTarget.id);
            page.current_tab = e.currentTarget.id;

        });

        $('#btnNew').click(function (e) {
            let $form = $('#basicForm');
            $form[0].reset();
            $('#company_type').val('');
            $('#company_type').select2();

            $('#basicForm').find('#id').val('');
            $('#company_type').removeAttr('disabled');
            $('#basicForm input').each(function () {
                if ($(this).is(':disabled')) {
                    $(this).removeAttr('disabled');
                }
            });
            $('#manageForm input').each(function () {
                if ($(this).is(':disabled')) {
                    $(this).removeAttr('disabled');
                }
            });
            //page.setButtonDisable1(true, false, true);
            page.setButtonState();
        });

        $('#btnSave').click(function (e) {
            Alert.confirm('',
                '저장하시겠습니까?',
                function () { page.saveData() },
                function () { }
            );
        });

        $('#btnDelete').click(function (e) {
            Alert.confirm('',
                '삭제하시겠습니까?',
                function () { page.deleteData() },
                function () { }
            );
        });

        // 엑셀 다운로드
        $('#btnExcel1').click(function (e) {
            GridUtil.exportExcel(page.grid1, { fileName: '업체정보.xlsx' });
        });

        //그리드 컬럼 설정
        page.popColSetting = new popColSetting();
        page.popColSetting.loadColumnData(gui.gui_code, gui.template_key, 'grid', page.grid1);
        if (userinfo.group_code == 'admin') {
            $('#btnGridSetting1').css('visibility', 'visible');
        }
        $('#btnGridSetting1').click(function (e) {
            let _this = this;
            page.popColSetting.show(gui.gui_code, gui.template_key, 'grid1', null, page.grid1, { 'order_fix': false, 'fix_cols': 0 });
        });

        page.searchMainData1();

        /*

            //<button type="button" class="btn-default" id="btnInitCompany" data-labelCd="초기데이터생성">초기데이터생성</button>
            let data = { action: 'purchase' }; //product, semi, raw_mat
            AjaxUtil.getAsyncData('/api/setup/mat', data, function (result) {
                if (result.success) {
                    Notify.success('성공');
                }
                else {
                    Notify.error('에러');
                }
            });
        });
        */
    });


</script>
