{% extends "app/layout_page.html" %}

{% block css %}
{% endblock %}

{% block content %}
<div class="card">
    <div class="d-flex card-header justify-content-between align-items-center">
        <h4 class="header-title">
            <span data-labelCd="단위정보">단위 정보</span>
            <a href="javascript:void(0);"><i class="uil uil-favorite favorite-on"></i></a>
        </h4>
    </div>
    <div class="collapse show" id="unitSearchCollapse">
        <div class="card-body">
            <form id="searchForm" autocomplete="off">
                <div class="row">
                    <div class="col-12 col-sm-6 col-lg-4 col-xl-4 col-xxl-3">
                        <div class="d-flex align-items-center justify-content-between">
                            <label for="txtUnit" class="form-label" data-labelCd="단위명">단위명</label>
                            <input class="form-control" id="txtUnit" name="txtUnit" />
                            <button type="button" class="col-auto-flex btn btn-search" id="btnSearch" data-commonCd="조회">조회</button>
                        </div>
                    </div>
                </div>
            </form>
        </div>
    </div>
    <div class="floder-close">
        <a class="text-dark" data-bs-toggle="collapse" href="#unitSearchCollapse" role="button" aria-expanded="true" aria-controls="unitSearchCollapse">
            <i class="uil uil-angle-down"></i>
        </a>
    </div>
</div>

<div class="d-flex justify-content-between align-items-center upper-wezongrid">
    <div class="sub-tit">
        <span class="right_align rpt" data-labelCd="단위 정보">단위 정보</span>
    </div>
    <div class="flex-wrap gap-2">
        <button type="button" class="btn rounded-pill btn-icon" id="btnExcel" title="엑셀 다운로드" data-labelCd="엑셀 다운로드" data-labelTarget="title"><i class="uil uil-file-times"></i></button>
        <button type="button" class="btn rounded-pill btn-icon" id="btnGridSetting" style="visibility:hidden" title="Grid Settings"><i class="uil uil-cog"></i></button>
    </div>
</div>
<div id="unit-grid"></div>

<div class="card mb-0 mt-2 p-15">
    <div class="d-flex justify-content-between align-items-center mb-2">
        <div class="sub-tit">
            <span class="right_align rpt" data-commonCd="상세 정보">상세 정보</span>
        </div>
        <div class="flex-wrap gap-2">
            <button type="button" class="btn btn-input" id="btnNew" name="btnNew" data-commonCd="등록">등록</button>
            <button type="button" class="btn btn-dell y_write_auth" id="btnDel" data-commonCd="삭제">삭제</button>
            <button type="button" class="btn btn-band y_write_auth" id="btnSave" data-commonCd="저장">저장</button>
        </div>
    </div>
    <form id="unitForm">
        <div class="card mb-0 p-15">
            <div class="row">
                <input class="form-control" type="text" id="id" name="id" hidden/>
                <div class="col-xl-4 col-sm-6 col-lg-12">
                    <div class="d-flex align-items-center">
                        <label for="name" class="form-label" data-labelCd="단위명">단위명</label>
                        <input class="form-control" id="name" name="name" disabled required/>
                    </div>
                </div>
                <div class="col-xl-4 col-sm-6 col-lg-12">
                    <div class="d-flex align-items-center">
                        <label for="piece_yn" class="form-label" data-labelCd="낱개단위">낱개단위</label>
                        <select class="form-select" id="piece_yn" name="piece_yn" disabled>
                            <option value="">No</option>
                            <option value="Y">Yes</option>
                        </select>
                    </div>
                </div>
                <div class="col-12">
                    <div class="d-flex align-items-center">
                        <label for="description" class="form-label" data-commonCd="설명">설명</label>
                        <textarea class="form-control h-26" id="description" name="description" disabled></textarea>
                    </div>
                </div>
            </div>
        </div>
    </form>
</div>
{% endblock %}


{% block scripts %}
{% include '../common/columns_setting.html' %}
<script type="text/javascript">
    class UnitPage {
        constructor() {
            this.grid = null;
            this.init(); 
            this.dataSource = null;
        }

        init() {
            let _this = this;

            this.grid = WeZonGrid.create('#unit-grid', {
                columnLayout: [
                    { dataField: 'name', headerText: '단위명', width: 150, align: 'left' }
                    , { dataField: 'description', headerText: '설명', width: 300, align: 'left' }
                    , { dataField: 'piece_yn', headerText: '낱개단위YN', width: 100, align: 'center' }
                ]
                , props: { height: 400, enableSorting: true, selectionMode: 'singleRow' }
            });
            GridUtil.fitWidth(this.grid);

            _this.grid.on('cellClick', function(e) {
                _this.showDetail(e.item.id);
            });
        }
        
        //버튼 활성화 
        setButtonState() {
            //let pk = $('unitForm').find('#id').val();
            //let pk = this.grid.getList('selected');
            let pk = $('#id').val();
            $('#btnNew').prop('disabled', false);
            $('#btnSave').prop('disabled', false);
            if (pk) {
                $('#btnDel').prop('disabled',false);
            }
            else {
                $('#btnDel').prop('disabled', true);
            }
        }

        showDetail(idx) {
            //console.log('showDetail', idx);
            let param = { 'unit_id': idx, "action": 'detail' };
            let url = '/api/definition/unit';
            AjaxUtil.getAsyncData(url, param, function (result) {
                if (result != null) {
                    FormUtil.BindDataForm(result, $('#unitForm'));
                    $('#description').text(result.description);
                }
                console.log('result : ', result);
                page.setButtonState();
            });
        }

        searchMainData() {
            let _this = this;
            let data = $('#txtUnit').val();
            let url = '/api/definition/unit?unit_name=' + data;
            AjaxUtil.getAsyncData(url, data, function (result) {

                $('#unitForm')[0].reset();
                $('#description').text('');
                $('#unitForm').find('select, input, textarea').each(function () {
                    if (!$(this).is(':disabled')) {
                        $(this).attr('disabled', 'disabled');
                    }
                });
                if (result != null) {
                    let recordsTotal = result.length;
                    _this.grid.setData(result);
                    _this.setButtonState();
                }
            });
        }//searchMainData

        saveUnit() {
            let _this = this;
            let url = '/api/definition/unit?action=save';

            //let data = $('#unitForm').serialize();
            let data = FormUtil.extractForm($('#unitForm'));

            let fnSuccess = function (res) {
                Notify.success('저장되었습니다'); // Notification
                _this.searchMainData();
            };
           AjaxUtil.postAsyncData(url, data, fnSuccess);
        }

        deleteUnit(id) {
            let _this = this;
            let url = '/api/definition/unit?action=delete';
            let data = { id: id };
            let fnSuccess = function (res) {
                if (res.success) {
                    Notify.success('삭제되었습니다'); // Notification
                    _this.searchMainData();
                } else {
                    Alert.alert('', res.message);
                }
            };
            AjaxUtil.postAsyncData(url, data,fnSuccess);
        }


    }
    var page = null;
    $(document.body).ready(function (e) {

        page = new UnitPage();

        page.popColSetting = new popColSetting();
        page.popColSetting.loadColumnData(gui.gui_code, gui.template_key, 'grid',  page.grid);
        
        if (userinfo.group_code == 'admin') {
        
        $('#btnGridSetting').css('visibility','visible');
        
        }
        
        $('#btnGridSetting').click(function (e) {
        page.popColSetting.show(gui.gui_code, gui.template_key, 'grid', null, page.grid, { 'order_fix': false, 'fix_cols': 0 });
        });

        page.searchMainData();

        // 검색버튼 클릭
        $('#btnSearch').click(function (e) { page.searchMainData(); });

        // 엔터키 검색
        $('#txtUnit').on('keypress', function (e) {
            if (event.keyCode == 13) {
                event.preventDefault();
                page.searchMainData();
            }
        });

        // 엑셀 다운로드
        $('#btnExcel').click(function (e) {
            GridUtil.exportExcel(page.grid, { fileName: '단위정보.xlsx' });
        });

        //신규버튼 클릭
        $('#btnNew').click(function (e) {

            $('#unitForm')[0].reset();
            $('#id').val('');
            $('#description').val('');
            
            $('#unitForm input, select').each(function () {
                if ($(this).is(':disabled')) {
                    $(this).removeAttr('disabled');
                }
            });

            $('#unitForm textarea').each(function () {
                if ($(this).is(':disabled')) {
                    $(this).removeAttr('disabled');
                }
            });
            //page.setButtonDisable(true, false, true);
            page.setButtonState();
        });

        //저장버튼 클릭
        $('#btnSave').click(function (e) {
            Alert.confirm('', 
                '저장하시겠습니까?',
                function () { page.saveUnit() },
                function () { }
            );
        });

        //삭제버튼 클릭
        $('#btnDel').click(function (e) {
            let id = $('#unitForm').find('#id').val()
            Alert.confirm('', 
                '삭제하시겠습니까?',
                function () { page.deleteUnit(id) },
                function () { }
            );
            //page.searchMainData();
        });

    });
</script>
{% endblock %}
{% csrf_token %}
