{% extends "app/layout_page.html" %}
{% block css %}
{% endblock %}

{% block content %}
<div class="ifarm-popup">
    <div class="table_box">
        <div class="table_box_sub">
            <form id="userForm" autocomplete="off">
                {% csrf_token %}
                <div class="row">
                    <div class="col-12" >
                        <div class="d-flex align-items-center">
                            <label for="login_id" class="form-label" data-labelCd="아이디">아이디</label>
                            <input type="text" class="form-control" id="login_id" name="login_id" placeholder="아이디" title="" required readonly="readonly" />
                        </div>
                    </div>
                    <div class="col-12" >
                        <div class="d-flex align-items-center">
                            <label for="name" class="form-label" data-commonCd="이름">이름</label>
                            <input type="text" class="form-control" id="name" name="name" placeholder="이름" title="" disabled="disabled" required />
                        </div>
                    </div>

                    <div class="col-12">
                        <div class="d-flex align-items-center">
                            <label for="loginPwd" class="form-label" data-labelCd="비밀번호">비밀번호</label>
                            <div class="d-flex align-items-center">
                                <input type="password" class="form-control" id="loginPwd" name="loginPwd" placeholder="비밀번호" title="" />
                                <i class="uil uil-eye toggle-password" data-toggle="#loginPwd"></i>
                            </div>
                        </div>
                    </div>
                      
                    <div class="col-12">
                        <div class="d-flex align-items-center">
                            <label for="loginPwd2" class="form-label" data-labelCd="비밀번호 확인">비밀번호 확인</label>
                            <div class="d-flex align-items-center">
                                <input type="password" class="form-control" id="loginPwd2" name="loginPwd2" placeholder="비밀번호 확인" title="" />
                                <i class="uil uil-eye toggle-password" data-toggle="#loginPwd2"></i>
                            </div>
                        </div>
                    </div>
                    <div class="col-12">
                        <div class="password-criteria">
                            <ul>
                                <!-- 여기에 JavaScript를 통해 동적으로 비밀번호 조건을 추가합니다. -->
                            </ul>
                        </div>
                    </div>
                </div>
            </form>
        </div>
    </div>
    <div class="mt-2 d-flex justify-content-center gap-1">
        <button type="button" class="btn btn-band" id="btn_save_user" data-commonCd="저장"><span data-commonCd="저장">저장</span></button>
        <button type="button" class="btn btn-dell" id="modal-close-button" data-bs-dismiss="modal" data-commonCd="닫기"><span data-commonCd="닫기">닫기</span></button>
    </div>
</div>

{% endblock %}

{% block scripts %}
<script type="text/javascript">
    // 전역 스코프 또는 상위 스코프에서 passOption 정의
    let passOption = {
        length: [8, 20],
        lower: 1,
        upper: 1,
        numeric: 1,
        special: 1,
        badWords: [],
        badSequenceLength: 0
    };

    $(document.body).ready(function () {
        i18n.initialize();
        i18n.applyLabel();

        $("body").css("overflow", "hidden"); 
        $('.joinout').hide();
        $(".profile_mbox").hide();

        $.get('/api/system/myinfo', function (data) {
            FormUtil.BindDataForm(data, $('#userForm'));
        }).fail(function (e) {
            Notify.error(JSON.parse(e.responseText).message);
        });

        // 사용자저장버튼
        $('#btn_save_user').on('click', function () {
            $('#userForm').submit();
        });

        function closeAccountModal() {
            try {
                if (window.parent && window.parent !== window) {
                    if (parent.modal) {
                        if (typeof parent.modal.close === 'function') {
                            parent.modal.close();
                            return;
                        }
                        if (typeof parent.modal.hide === 'function') {
                            parent.modal.hide();
                            return;
                        }
                    }
                    if (parent.i18n && parent.i18n.modal) {
                        if (typeof parent.i18n.modal.close === 'function') {
                            parent.i18n.modal.close();
                            return;
                        }
                        if (typeof parent.i18n.modal.hide === 'function') {
                            parent.i18n.modal.hide();
                            return;
                        }
                    }
                }
            } catch (err) {
                console.log(err);
            }
        }

        $('#modal-close-button, [data-bs-dismiss="modal"]').on('click', function (e) {
            e.preventDefault();
            closeAccountModal();
        });

        let validatePassword = function(pw, options) {
            // default options (allows any password)
            var o = {
                lower: 0,
                upper: 0,
                alpha: 0, /* lower + upper */
                numeric: 0,
                special: 0,
                length: [0, Infinity],
                custom: [ /* regexes and/or functions */],
                badWords: [],
                badSequenceLength: 0,
                noQwertySequences: false,
                noSequential: false
            };

            for (var property in options)
                o[property] = options[property];

            var re = {
                lower: /[a-z]/g,
                upper: /[A-Z]/g,
                alpha: /[A-Z]/gi,
                numeric: /[0-9]/g,
                special: /[\W_]/g
            },
                rule, i;

            // enforce min/max length
            if (pw.length < o.length[0] || pw.length > o.length[1])
                return false;

            // enforce lower/upper/alpha/numeric/special rules
            for (rule in re) {
                if ((pw.match(re[rule]) || []).length < o[rule])
                    return false;
            }

            // enforce word ban (case insensitive)
            for (i = 0; i < o.badWords.length; i++) {
                if (pw.toLowerCase().indexOf(o.badWords[i].toLowerCase()) > -1)
                    return false;
            }

            // enforce the no sequential, identical characters rule
            if (o.noSequential && /([\S\s])\1/.test(pw))
                return false;

            // enforce alphanumeric/qwerty sequence ban rules
            if (o.badSequenceLength) {
                var lower = "abcdefghijklmnopqrstuvwxyz",
                    upper = lower.toUpperCase(),
                    numbers = "0123456789",
                    qwerty = "qwertyuiopasdfghjklzxcvbnm",
                    start = o.badSequenceLength - 1,
                    seq = "_" + pw.slice(0, start);
                for (i = start; i < pw.length; i++) {
                    seq = seq.slice(1) + pw.charAt(i);
                    if (
                        lower.indexOf(seq) > -1 ||
                        upper.indexOf(seq) > -1 ||
                        numbers.indexOf(seq) > -1 ||
                        (o.noQwertySequences && qwerty.indexOf(seq) > -1)
                    ) {
                        return false;
                    }
                }
            }
            // enforce custom regex/function rules
            for (i = 0; i < o.custom.length; i++) {
                rule = o.custom[i];
                if (rule instanceof RegExp) {
                    if (!rule.test(pw))
                        return false;
                } else if (rule instanceof Function) {
                    if (!rule(pw))
                        return false;
                }
            }

            // great success!
            return true;
        }

        // 사용자저장 시 validation 체크
        $('#userForm').validate({
            submitHandler: function (form) {
                var $form = $(form);
                if ($('#loginPwd').val() != '') {

                    let validationResult = validatePassword($('#loginPwd').val(), passOption);
                    if (!validationResult) {
                        Alert.alert('', '비밀번호 조건을 만족하지 않습니다.');
                        return;
                    }

                    if ($('#loginPwd').val() != $('#loginPwd2').val()) {
                        Alert.alert('', '비밀번호가 일치하지 않습니다.', function () {
                            $('#loginPwd2').focus();
                        });
                        return false;
                    }
                }

                let url = '/api/system/myinfo?action=password_change';
                let fnsuccess = function (res) {
                    // 비밀번호 정책 위반은 200 에 success:false 로 온다.
                    if (res && res.success === false) {
                        Alert.alert('', res.message);
                        return;
                    }
                    Notify.success('수정되었습니다.');
                }

                //let paramData = $form.serialize();
                let paramData = FormUtil.extractForm($form);
                AjaxUtil.postAsyncData(url, paramData, fnsuccess);
            }
        });

        // 비밀번호 정책 옵션을 UI에 동적으로 추가하는 함수
        function updatePasswordCriteriaUI() {
            let criteriaList = $('.password-criteria ul');
            criteriaList.empty(); // 기존 목록을 초기화

            // 길이 조건 확인 및 추가
            if(passOption.length[0] > 0) {
                criteriaList.append(`<li id="lengthCriteria"><i class="uil uil-minus criteria-idle"></i> 비밀번호는 최소 ${passOption.length[0]}자 이상이어야 합니다.</li>`);
            }

            // 소문자 포함 조건 추가
            if(passOption.lower) {
                criteriaList.append('<li id="lowerCriteria"><i class="uil uil-minus criteria-idle"></i> 최소 한 개의 소문자를 포함해야 합니다.</li>');
            }

            // 대문자 포함 조건 추가
            if(passOption.upper) {
                criteriaList.append('<li id="upperCriteria"><i class="uil uil-minus criteria-idle"></i> 최소 한 개의 대문자를 포함해야 합니다.</li>');
            }

            // 숫자 포함 조건 추가
            if(passOption.numeric) {
                criteriaList.append('<li id="numericCriteria"><i class="uil uil-minus criteria-idle"></i> 최소 한 개의 숫자를 포함해야 합니다.</li>');
            }

            // 특수문자 포함 조건 추가
            if(passOption.special) {
                criteriaList.append('<li id="specialCriteria"><i class="uil uil-minus criteria-idle"></i> 최소 한 개의 특수문자를 포함해야 합니다.</li>');
            }

            // 비밀번호 일치 조건은 항상 확인
            criteriaList.append('<li id="matchCriteria"><i class="uil uil-minus criteria-idle"></i> 비밀번호가 일치해야 합니다.</li>');
        }

        // 페이지 로딩 시 비밀번호 정책 UI 업데이트
        updatePasswordCriteriaUI();

        // 비밀번호 입력 및 비밀번호 일치 확인 로직
        $('#loginPwd, #loginPwd2').on('input', function() {
            const password = $('#loginPwd').val();
            const lengthCriteriaIcon = $('#lengthCriteria i');
            const lowerCriteriaIcon = $('#lowerCriteria i');
            const upperCriteriaIcon = $('#upperCriteria i');
            const numericCriteriaIcon = $('#numericCriteria i');
            const specialCriteriaIcon = $('#specialCriteria i');
            const confirmPassword = $('#loginPwd2').val();
            const matchCriteriaIcon = $('#matchCriteria i');

            // 아직 아무것도 입력하지 않았으면 평가하지 않는다. 빨간 X 로 두면
            // 열자마자 전부 오류인 것처럼 보인다.
            const $icons = $('.password-criteria li i');
            if (!password && !confirmPassword) {
                $icons.removeClass('uil-times uil-check uil-minus criteria-idle').addClass('uil-minus criteria-idle');
                return;
            }
            $icons.removeClass('uil-minus criteria-idle');

            // 길이 조건 확인
            lengthCriteriaIcon.removeClass('uil-times uil-check uil-minus criteria-idle').addClass(password.length >= passOption.length[0] ? 'uil-check' : 'uil-times');

            // 소문자 포함 조건 확인
            lowerCriteriaIcon.removeClass('uil-times uil-check uil-minus criteria-idle').addClass(/[a-z]/.test(password) ? 'uil-check' : 'uil-times');

            // 대문자 포함 조건 확인
            upperCriteriaIcon.removeClass('uil-times uil-check uil-minus criteria-idle').addClass(/[A-Z]/.test(password) ? 'uil-check' : 'uil-times');

            // 숫자 포함 조건 확인
            numericCriteriaIcon.removeClass('uil-times uil-check uil-minus criteria-idle').addClass(/[0-9]/.test(password) ? 'uil-check' : 'uil-times');

            // 특수문자 포함 조건 확인
            specialCriteriaIcon.removeClass('uil-times uil-check uil-minus criteria-idle').addClass(/[\W_]/.test(password) ? 'uil-check' : 'uil-times');

            // 비밀번호 일치 조건 검사
            if (password && confirmPassword) {
                matchCriteriaIcon.removeClass('uil-times uil-check uil-minus criteria-idle').addClass(password === confirmPassword ? 'uil-check' : 'uil-times');
            } else {
                matchCriteriaIcon.addClass('uil-times').removeClass('uil-check uil-minus criteria-idle');
            }
        });

        // 비밀번호 표시 전환
        $('.toggle-password').on('click', function() {
            const toggleId = $(this).data('toggle');
            const passwordInput = $(toggleId);
            if (passwordInput.attr('type') === 'password') {
                passwordInput.attr('type', 'text');
                $(this).removeClass('uil-eye').addClass('uil-eye-slash');
            } else {
                passwordInput.attr('type', 'password');
                $(this).removeClass('uil-eye-slash').addClass('uil-eye');
            }
        });

    });
</script>
{% endblock %}
