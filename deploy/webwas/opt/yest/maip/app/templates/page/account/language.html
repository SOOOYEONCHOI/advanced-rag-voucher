{% extends "app/layout_page.html" %}
{% block css %}
{% endblock %}

{% block content %}
<div class="ifarm-popup">
    <header class="d-flex justify-content-between align-items-center">
        <h4 data-commonCd="언어설정">언어설정</h4>
        <button type="button" class="btn-close" id="modal-close" data-bs-dismiss="modal" aria-label="Close"></button>
    </header>

    <div class="table_box">
            <div class="table_box_sub">
                <div class="row">

                   <div class="col-12" >
                        <div class="input-group" >
                            <div class="input-group-prepend">
                                <span class="input-group-text fit_box_md" data-commonCd="언어설정">Language</span>
                            </div>
                            <select class="form-select" id="LangCode" name="LangCode"></select>
                        </div>
                    </div>

                </div>
            </div>
    </div>

    <div class="mt-2 d-flex justify-content-center gap-1">
            <button type="button" class="btn btn-band" id="saveLanguage" data-labelCd="Save"><span data-commonCd="저장">Save</span></button>
            <button type="button" class="btn btn-dell" id="modal-close-button" data-bs-dismiss="modal" data-labelCd="Close"><span data-commonCd="닫기">Close</span></button>
        </div>
</div>


{% endblock %}

{% block scripts %}
<script type="text/javascript">
    $(document).ready(function (e) {
        //i18n.initialize();
        //i18n.applyLabel();
        $("body").css("overflow", "hidden"); 

        $('.joinout').hide();
        $(".profile_mbox").hide();

        
        let $LangCode = $('#LangCode');
        
        AjaxUtil.fillSelectOptions($LangCode, 'system_code', false, i18n.getLanguageCode(), 'lang_code');

        let $saveLanguage = $('#saveLanguage');
        $saveLanguage.click(function (e) {
            let lang_code = $LangCode.val();
            sessionStorage.setItem('lang_code', lang_code);
            i18n.resetData();
            Alert.confirm('', '적용되었습니다. \r\n화면을 새로 고치겠습니까?', function () {
                if (parent) {
                    parent.location.reload();
                } else {
                    location.reload();
                }
            });
        });


        function closeAccountModal() {
            try {
                if (window.parent && window.parent !== window) {
                    if (parent.modal) {
                        if (typeof parent.modal.close === 'function') {
                            parent.modal.close();
                            return;
                        }
                        if (typeof parent.modal.hide === 'function') {
                            parent.modal.hide();
                            return;
                        }
                    }
                    if (parent.i18n && parent.i18n.modal) {
                        if (typeof parent.i18n.modal.close === 'function') {
                            parent.i18n.modal.close();
                            return;
                        }
                        if (typeof parent.i18n.modal.hide === 'function') {
                            parent.i18n.modal.hide();
                            return;
                        }
                    }
                }
            } catch (err) {
                console.log(err);
            }
        }

        $('#modal-close, #modal-close-button, [data-bs-dismiss="modal"]').on('click', function (e) {
            e.preventDefault();
            closeAccountModal();
        });
    });

</script>
{% endblock %}
