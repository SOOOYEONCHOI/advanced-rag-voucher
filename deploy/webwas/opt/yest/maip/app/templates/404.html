{% load static %}
<!DOCTYPE html >
<html>
<head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <!-- Icons css -->
   <link href="{% static 'assets/css/mdi/css/materialdesignicons.min.css' %}" rel="stylesheet" type="text/css" />
    <title>페이지 없음</title>
    <style>
    * { -webkit-box-sizing: border-box; -moz-box-sizing: border-box; box-sizing: border-box;}
    *:before, *:after { -webkit-box-sizing: border-box; -moz-box-sizing: border-box; box-sizing: border-box;}

    /*  공통 스타일 */
    html, body { width:100%; height:100%; margin:0; padding:0; }
    html, body, button  { font-family:'prentpretendard','Open Sans','Helvetica Neue', sans-serif; }
    div { padding: 0}
    ul, li, ol, dl, dt, dd {margin:0; padding:0; list-style:none}
    h1, h2, h3, h4, h5, h6 { margin:0; padding:0; line-height:20px}
    a, a:link, a:hover { text-decoration:none!important; cursor:pointer; color:#1b62f1;}
    a, img {border:0; text-decoration:none!important;}	
    button { border-radius: 3px !important; padding: .375rem .775rem !important;}
    #wrap { width:100%; height:100%; margin:0; padding:0;}
    
    
.error-wrap { 
    display:flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    width: 100%;
    padding-top:20px;
}
.error-box {
    display:flex;
    align-items: center;
}
.error-box i {
    font-size:15rem;
    color: #dc5353;
}
.error-title {
    display:flex;
    flex-direction: column;
    align-items: center;
}
.error-title h1 {
    color: #898989;
    letter-spacing:-0.0375em;
}
.error-title span {
    padding:25px 0;
    display:flex;
    align-items: center;
    font-size:16px;
    color: #898989;
    font-weight:400;
    letter-spacing:-0.0375em;
}
.error-bottom {
    position:absolute;
    width:100%;
    background: transparent;
    text-align: center;
    color: #898989;
    font-size:13px;
    bottom:0
}
.error-bottom-img {
    position:absolute;
    right:0;
    bottom:14%;
}

.error-before-btn {		
    background:#fff;
    border:1px solid #d8d8d8;
    color:#6b6b6b;
}

.text-error {
    text-shadow: rgba(#d8d8d8, .3) 5px 1px, rgba(#d8d8d8, .2) 10px 3px;
    font-size: 3rem;
}
.text-error i:before {
    color: #dc5353;
}
    </style>
</head>

<body >
<div id="wrap">
    
    <div class="error-wrap">
        <div class="error-box">
            <i class="mdi mdi-robot-confused"></i>
            <!--<img src="{% static 'assets/images/error_404.png' %}" alt="에러이미지"/>-->
        </div>
        <div class="error-title">
            <h1 class="text-error">4 <i class="mdi mdi-emoticon-sad"></i> 4 Error</h1>
            <span>요청한 페이지를 찾을 수 없습니다. 주소를 다시 확인해 주세요.</span>
            <span></span>
            <!--
            <button class="error-before-btn" data-labelCd="이전페이지">이전페이지</button>
            -->
        </div>
    
    </div>

    <!--<div class="error-bottom-img">
        <div class="error-bottom-img"><img src="{% static 'assets/images/error_bottom_img.png' %}" alt="하단 이미지" /></div>
    </div>-->
    <div style="display:none">
        ({{message}})
    </div>
</div>


</body>
</html>
