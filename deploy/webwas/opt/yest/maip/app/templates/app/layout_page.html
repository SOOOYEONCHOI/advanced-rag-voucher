{% load static %}
<!DOCTYPE html>
<html lang="ko" xmlns="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="utf-8" />
    <title>제조AI플랫폼</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- App favicon -->
    <link rel="shortcut icon" href="{% static 'assets/images/favicon.ico' %}">
    <!-- Daterangepicker css -->
    <link href="{% static 'assets/vendor/daterangepicker/daterangepicker.css' %}" rel="stylesheet" type="text/css">
    <!-- Theme Config Js -->
    <script src="{% static 'assets/js/hyper-config.js' %}"></script>
    <!-- Vendor css -->
    <link href="{% static 'assets/css/vendor.min.css' %}" rel="stylesheet" type="text/css" />
    <!-- App css -->
    <link href="{% static 'assets/css/app.min.css' %}" rel="stylesheet" type="text/css" id="app-style" />  
    <!-- Icons css -->
    <link href="{% static 'assets/css/unicons/css/unicons.css' %}" rel="stylesheet" type="text/css" />
    <link href="{% static 'assets/css/remixicon/remixicon.css' %}" rel="stylesheet" type="text/css" />
    <link href="{% static 'assets/css/mdi/css/materialdesignicons.min.css' %}" rel="stylesheet" type="text/css" />
    
    <!-- Font css -->
    <link href="{% static 'assets/css/pretendard.css' %}" rel="stylesheet" />
    <!-- Custom css -->
    <link href="{% static 'assets/css/SF-Custom.css' %}" rel="stylesheet" type="text/css"  />

    {% block css %}{% endblock %}

</head>
<body class="animated fadeIn{% if request.GET.embed == '1' %} embedded{% endif %}">
    {% csrf_token %}

    <div id="loadingSplash" style="display:none;position:fixed;top:10%;left:50%;
        transform:translate(-50%, -50%);background:#fff;padding:20px;
        box-shadow:0 0 10px rgba(0,0,0,0.3);z-index:9999;">
        <img src="{% static 'assets/images/loading-gif.gif' %}" style="width:100px;height:100px;">
    </div>
    <script type="text/javascript">
        {% include './system.js' %}
    </script>

    <!-- Vendor js,  이거 jQuery임-->
    <script src="{% static 'assets/js/vendor.min.js' %}"></script>

    <!-- App js -->
    <script src="{% static 'assets/js/app.js' %}"></script>

    <!-- Daterangepicker js -->
    <script src="{% static 'assets/vendor/moment/moment.min.js' %}"></script>
    <script src="{% static 'assets/vendor/daterangepicker/daterangepicker.js' %}"></script>



    <script type="text/javascript" src="{% static 'assets/vendor/jquery-validation/1.22.1/jquery.validate.min.js' %}"></script>    
    <script type="text/javascript" src="{% static 'assets/vendor/JavaScript-Templates/tmpl.min.js' %}"></script>
    <script src="{% static 'assets/vendor/decimal.js/decimal.js' %}"></script>
    <script src="{% static 'assets/js/decimal-util.js' %}"></script>
    <script type="text/javascript" src="{% static 'assets/js/common.js' %}"></script>
    <script type="text/javascript" src="{% static 'assets/js/bscommUtil.js' %}"></script>
    <script type="text/javascript" src="{% static 'assets/js/grid.js' %}"></script>
    <!-- WeZonGrid -->
    <link href="{% static 'wezongrid/wezongrid.css' %}" rel="stylesheet" type="text/css" />
    <link href="{% static 'assets/css/tokens.css' %}" rel="stylesheet" type="text/css" />
    <!-- <link rel="stylesheet" href="{% static 'wezongrid/wezongrid.min.css' %}"> -->
    <script src="{% static 'wezongrid/wezongrid.js' %}"></script>
    <!-- SheetJS(WeZonGrid exportToExcel 의존, 0.9MB)는 엑셀을 누를 때 GridUtil.exportExcel 이 싣는다 -->
    <script type="text/javascript">window.XLSX_URL = "{% static 'assets/vendor/xlsx/xlsx.full.min.js' %}";</script>
<div class="ifram-wrapper">
    {% block content %}
    {% endblock %}
</div>
    <script type="text/javascript">


        $(document).ready(function () {
            yullinAuth.removeWriteButton();
            //console.log('layout ready');

            var _wintitle = CommonUtil.getParameters('wintitle');
            if (_wintitle != '') {
                $('title').text(_wintitle);
            }
            authDisableBtn(''); // 버튼권한 처리==>정리대상
            authDisableTab(''); // TAB권한 처리==>정리대상
            var searchheight = parseInt($('.autoheight-search').height() === null ? '0' : $('.autoheight-search').height()) + 65;
            if ($('.autoheight-div') !== null) {
                $('.autoheight-div').height($(document).height() - searchheight);
            }
            if ($('section.popupcontent') !== null) {
                $('section.popupcontent').height($(window).height() - 130);
            }

            $('#btnHedaerFilter').click(function (e) {
                $(".table_box.search").toggle(300);
            });

            $('#btnHeaderCompress').click(function (e) {
                let $wrap = window.parent.$('.wrap');

                window.parent.$('.header').toggle();
                window.parent.$('.page-tabs').toggle();

                if (window.parent.$('.header').css('display') == 'none') {
                    $('#iCompress').replaceWith("<i class='uil uil-compress-alt' id='iCompress'></i>");
                    $wrap.addClass('menu_close');
                } else {
                    $('#iCompress').replaceWith("<i class='uil uil-compress' id='iCompress'></i>");
                    $wrap.removeClass('menu_close');
                }
            });

            // 즐겨찾기 별표 직접 바인딩
            (function() {
                var guiCode = (window.gui && gui.gui_code) ? String(gui.gui_code).trim() : '';
                // fallback: URL 경로에서 gui_code 추출 (/gui/wm_xxx/default)
                if (!guiCode) {
                    var m = location.pathname.match(/\/gui\/([^\/]+)/);
                    if (m) guiCode = m[1];
                }
                if (!guiCode) return;
                var $links = $('.header-title a').filter(function() {
                    return $(this).find('i.uil-favorite').length > 0;
                });
                if (!$links.length) return;

                // 현재 상태 로드
                AjaxUtil.getAsyncData('/api/system/bookmark', {}, function (bookmarks) {
                    var isOn = Array.isArray(bookmarks) && bookmarks.some(function(b) {
                        return b && String(b.code || '').trim() === guiCode;
                    });
                    $links.find('i.uil-favorite').toggleClass('favorite-on', isOn).toggleClass('favorite-off', !isOn);
                }, function () {});

                // 클릭 이벤트
                $links.off('click').on('click', function(e) {
                    e.preventDefault();
                    e.stopPropagation();
                    var $icon = $(this).find('i.uil-favorite');
                    var wasOn = $icon.hasClass('favorite-on');
                    var nextState = !wasOn;
                    $icon.toggleClass('favorite-on', nextState).toggleClass('favorite-off', !nextState);
                    var csrf = $('[name=csrfmiddlewaretoken]').val();
                    $.post('/api/system/bookmark?action=save', {
                        menucode: guiCode, isbookmark: nextState, csrfmiddlewaretoken: csrf
                    }).done(function() {
                        // 부모 프레임의 즐겨찾기 탭 갱신
                        try {
                            if (window.parent && window.parent.refreshBookmarkTab) {
                                window.parent.refreshBookmarkTab(true);
                            }
                        } catch(ex) {}
                    }).fail(function () {
                        // 별은 먼저 바꿔 두었다. 저장이 실패하면 되돌리고 알린다.
                        $icon.toggleClass('favorite-on', wasOn).toggleClass('favorite-off', !wasOn);
                        Alert.alert('', '즐겨찾기를 저장하지 못했습니다. 잠시 후 다시 시도해 주세요.');
                    });
                    return false;
                });
            })();

        });
    </script>
    {% block scripts %}
    {% endblock %}
</body>
</html>
