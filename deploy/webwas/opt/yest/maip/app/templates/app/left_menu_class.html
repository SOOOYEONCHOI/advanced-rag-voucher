{% verbatim %}
<script type="text/x-tmpl" id="leftMenuTmpl">
    {% o.forEach(function (folder, i) {
        let folderName = i18n.getMenuText(folder.objNm);
        // objId 는 서버가 ASCII 로 고유하게 내려준다(폴더는 'f<PK>').
        // 한글 폴더명을 치환해서 쓰던 때는 글자 수가 같은 폴더끼리 id 가 겹쳐
        // Bootstrap collapse 가 둘을 함께 토글했다.
        let fid = 'fld_' + folder.objId;
        let top = folder.leaf;
    %}
    {% if (top) { %}
    <!-- 폴더 없이 1단계에 바로 보이는 메뉴(대시보드, menus.TOP_LEVEL_MENU_CODES) — 폴더의 아이콘을 쓴다 -->
    <li class="side-nav-item" level="0">
        <a href="javascript:void(0);" class="side-nav-link menu-leaf-link menu-top-link" level="0" title="{%=i18n.getMenuText(top.objNm)%}" data-url="{%=top.objUrl%}" data-mid="{%=top.objId%}" data-tab-title="{%=i18n.getMenuText(top.objNm)%}">
            {% if (folder.menuIconCls || null) { %} <i class="{%=folder.menuIconCls%}"></i> {% } %} <span>{%=i18n.getMenuText(top.objNm)%}</span>
        </a>
    </li>
    {% } else { %}
    <li class="side-nav-item" level="0">
        <a href="javascript:void(0);" class="side-nav-link" level="0" title="{%=folderName%}" data-bs-toggle="collapse" data-bs-target="#{%=fid%}" aria-expanded="false" aria-controls="{%=fid%}">
            {% if (folder.menuIconCls || null) { %} <i class="{%=folder.menuIconCls%}"></i> {% } %} <span>{%=folderName%}</span>
            <span class="menu-arrow"></span>
        </a>
        <div class="collapse" level="0" id="{%=fid%}" aria-expanded="false" aria-controls="{%=fid%}">
            <ul class="side-nav-second-level">
            {% folder.nodes.forEach(function (item, index) {
                let isFolder = (item.nodes || []).length > 0;
                let menuUrl = (item.objUrl == '') ? '#': item.objUrl;
                let menuName = i18n.getMenuText(item.objNm);
                let subId = 'sub_' + item.objId;
            %}
                 <li>
                    {% if (isFolder) { %}
                        <a href="javascript:void(0);" title="{%=menuName%}" data-bs-toggle="collapse" data-bs-target="#{%=subId%}" aria-expanded="false" aria-controls="{%=subId%}">
                            <span>{%=menuName%}</span>
                            <span class="menu-arrow"></span>
                        </a>
                        <div class="collapse" id="{%=subId%}" aria-expanded="false" aria-controls="{%=subId%}">
                            <div class="mnb-subflyout-header" aria-hidden="true">
                                {% if (item.menuIconCls || null) { %} <i class="{%=item.menuIconCls%}"></i> {% } %}
                                <span class="mnb-subflyout-header-label">{%=menuName%}</span>
                                <span class="menu-arrow"></span>
                            </div>
                            <ul class="side-nav-third-level">
                            {% item.nodes.forEach(function (subItem) {
                                let subUrl = (subItem.objUrl == '') ? '#': subItem.objUrl;
                                let subName = i18n.getMenuText(subItem.objNm);
                                let subIsFolder = (subItem.nodes || []).length > 0;
                                let leafId = 'sub_' + subItem.objId;
                            %}
                                <li>
                                {% if (subIsFolder) { %}
                                    <!-- 4단계: 비전 데이터 관리의 대분류 › 중분류 › 비전검사항목(설계 2026-10-21 §4). 접힌 사이드바에서도 펼침 메뉴 안에서 아래로 연다 -->
                                    <a href="javascript:void(0);" title="{%=subName%}" data-bs-toggle="collapse" data-bs-target="#{%=leafId%}" aria-expanded="false" aria-controls="{%=leafId%}">
                                        <span>{%=subName%}</span>
                                        <span class="menu-arrow"></span>
                                    </a>
                                    <div class="collapse" id="{%=leafId%}" aria-expanded="false">
                                        <ul class="side-nav-forth-level">
                                        {% subItem.nodes.forEach(function (leaf) {
                                            let leafUrl = (leaf.objUrl == '') ? '#': leaf.objUrl;
                                            let leafName = i18n.getMenuText(leaf.objNm);
                                        %}
                                            <li>
                                                <a href="javascript:void(0);" class="menu-leaf-link" data-url="{%=leafUrl%}" data-mid="{%=leaf.objId%}" data-tab-title="{%=leaf.tabTitle || leafName%}" title="{%=leafName%}"><span>{%=leafName%}</span></a>
                                            </li>
                                        {% }); %}
                                        </ul>
                                    </div>
                                {% } else { %}
                                    <a href="javascript:void(0);" class="menu-leaf-link" data-url="{%=subUrl%}" data-mid="{%=subItem.objId%}" data-tab-title="{%=subItem.tabTitle || (menuName + ' · ' + subName)%}" title="{%=subName%}"><span>{%=subName%}</span></a>
                                {% } %}
                                </li>
                            {% }); %}
                            </ul>
                        </div>
                    {% } else { %}
                        <a href="javascript:void(0);" class="menu-leaf-link" data-url="{%=menuUrl%}" data-mid="{%=item.objId%}"{% if (item.tabTitle) { %} data-tab-title="{%=item.tabTitle%}"{% } %} title="{%=menuName%}"><span>{%=menuName%}</span></a>
                    {% } %}
                 </li>
            {% }); %}
            </ul>
        </div>
    </li>
    {% } %}
    {% }); %}
</script>
{% endverbatim %}
<script type="text/javascript">
    class LeftMenuClass {
        constructor() {
            this.$leftSideNavi = $('#sideNavAll');
            this.$bookmarkNavi = $('#sideNavBookmark');
            this.$mnbPage = $('.mnb-page');
            this.$mnbList = this.$mnbPage.find('.mnb-list');
            this.$mnbCenter = this.$mnbPage.find('.center-tab');
            this.$contentPage = $('.content-page .content .container-fluid').first();
            this.$defaultContent = this.$contentPage.find('.ifram-box').first();
            this.$contextMenu = $('#mnbContextMenu');
            this.contextMenuTargetId = null;
            this.$panelHost = null;
            this.fixedFirstTabId = null;
            this.$condensedOpenItem = null;
            this.$condensedOpenSubItem = null;
            this.condensedOpenTimer = null;
            this.condensedCloseTimer = null;
            this.condensedSubCloseTimer = null;
            this.condensedSidenavObserver = null;
        } 


        addMenu() {
            let _this = this;
            let url = '/api/system/menus';
            AjaxUtil.getAsyncData(url, {}, function (data) {
                _this.$leftSideNavi.html(tmpl('leftMenuTmpl', data));
                _this.recalculateLeftMenuSimpleBar();
                // 고정 첫 탭은 메뉴 링크에서 찾는다. 메뉴가 그려진 뒤에 연다.
                _this.initFixedFirstTab();
                _this.refreshBadges();
            });
        }

        // 메뉴 잎의 건수 배지 — 수입검사 작성의 검사 대기(대기 작업 + 입고에 걸린 작성 중, 설계 2026-10-21 §6).
        // 메뉴를 그릴 때·5분마다·검사 저장·완료 뒤에 센다. 글자가 아니라 data-badge 속성(CSS ::after)이라 메뉴 이름(text())에 섞이지 않는다.
        // 메뉴가 없으면(권한 없음) 부르지 않는다. 실패해도 알리지 않는다 — 다음 번에 다시 센다
        refreshBadges() {
            let $link = this.$leftSideNavi.find('.menu-leaf-link[data-mid="wm_dig_form_incoming_write"]');
            if (!$link.length) {
                return;
            }
            AjaxUtil.getAsyncData('/api/dig_form/dig_form', { action: 'job_count' }, function (r) {
                let count = r && r.count;
                if (count > 0) {
                    $link.attr('data-badge', count > 99 ? '99+' : String(count));
                } else {
                    $link.removeAttr('data-badge');
                }
            }, function () { });
        }

        findNthTabs() {
            if (typeof window.nthTabs !== 'undefined' && window.nthTabs) {
                return window.nthTabs;
            }
            if (window.parent && typeof window.parent.nthTabs !== 'undefined' && window.parent.nthTabs) {
                return window.parent.nthTabs;
            }
            return null;
        }

        openNthTab(menuId, menuTitle, menuUrl, allowClose = true) {
            let tabs = this.findNthTabs();
            if (!tabs) {
                return;
            }

            let tabKey = '#' + menuId;
            try {
                if (typeof tabs.isExistsTab === 'function' && tabs.isExistsTab(tabKey)) {
                    if (typeof tabs.toggleTab === 'function') {
                        tabs.toggleTab(tabKey);
                    }
                    return;
                }

                if (typeof tabs.addTab === 'function') {
                    tabs.addTab({
                        id: String(menuId),
                        title: menuTitle,
                        url: menuUrl,
                        active: true,
                        allowClose: allowClose
                    });
                }
            } catch (err) {
                console.log('openNthTab error', err);
            }
        }

        closeNthTab(menuId) {
            if (this.fixedFirstTabId && String(menuId) === String(this.fixedFirstTabId)) {
                return;
            }
            let tabs = this.findNthTabs();
            if (!tabs) {
                return;
            }

            let tabKey = '#' + menuId;
            let closeFns = ['delTab', 'removeTab', 'closeTab'];
            for (let i = 0; i < closeFns.length; i++) {
                let fnName = closeFns[i];
                if (typeof tabs[fnName] === 'function') {
                    try {
                        tabs[fnName](tabKey);
                        return;
                    } catch (err) {
                        console.log('closeNthTab error', err);
                    }
                }
            }
        }

        ensureMnbTab(menuId, menuTitle, menuUrl, allowClose = true) {
            let selector = 'li[data-mid="' + menuId + '"]';
            let $exists = this.$mnbList.find(selector);
            if ($exists.length) {
                if (!allowClose) {
                    $exists.addClass('fixed-tab');
                    $exists.find('button.close').remove();
                }
                return $exists;
            }

            let $li = $('<li>').attr('data-mid', menuId);
            if (!allowClose) {
                $li.addClass('fixed-tab');
            }
            let $a = $('<a>')
                .attr('href', 'javascript:void(0);')
                .addClass('mnb-tab-link')
                .attr('data-mid', menuId)
                .attr('data-url', menuUrl);
            let $title = $('<span>').addClass('mnb-tab-title').text(menuTitle);
            $a.append($title);
            if (allowClose) {
                let $closeBtn = $('<button>')
                    .attr('type', 'button')
                    .addClass('close')
                    .attr('aria-label', 'Close tab')
                    .append('<i class="uil uil-times"></i>');
                $a.append($closeBtn);
            }
            $li.append($a);
            this.$mnbList.append($li);

            return $li;
        }

        ensurePanelHost() {
            if (this.$panelHost && this.$panelHost.length) {
                return this.$panelHost;
            }

            let $host = this.$contentPage.find('#mnb-tab-panels');
            if (!$host.length) {
                $host = $('<div id="mnb-tab-panels" class="mnb-tab-panels "></div>');
                this.$contentPage.append($host);
            }
            this.$panelHost = $host;
            return this.$panelHost;
        }

        ensureContentPanel(menuId, menuUrl, navigateExisting = false) {
            let $host = this.ensurePanelHost();
            let selector = '.mnb-tab-panel[data-mid="' + menuId + '"]';
            let $panel = $host.find(selector);
            if ($panel.length) {
                if (navigateExisting) {
                    $panel.find('iframe').first().attr('src', menuUrl);
                    this.$mnbList
                        .find('li[data-mid="' + menuId + '"] .mnb-tab-link')
                        .attr('data-url', menuUrl);
                }
                return $panel;
            }

            let iframeId = 'mnb_iframe_' + String(menuId).replace(/[^a-zA-Z0-9_-]/g, '_');
            $panel = $('<div class="mnb-tab-panel"></div>').attr('data-mid', menuId);
            let $iframe = $('<iframe>')
                .attr('id', iframeId)
                .attr('src', menuUrl)
                .attr('frameborder', '0')
                .attr('loading', 'lazy')
                .addClass('mnb-tab-iframe');

            $panel.append($iframe);
            $host.append($panel);
            return $panel;
        }

        activateContentPanel(menuId) {
            let $host = this.ensurePanelHost();
            let selector = '.mnb-tab-panel[data-mid="' + menuId + '"]';

            $host.find('.mnb-tab-panel').removeClass('active').hide();
            let $target = $host.find(selector);
            if ($target.length) {
                $target.addClass('active').show();
                if (this.$defaultContent.length) {
                    this.$defaultContent.hide();
                }
            } else if (this.$defaultContent.length) {
                this.$defaultContent.show();
            }
        }

        removeContentPanel(menuId) {
            let $host = this.ensurePanelHost();
            $host.find('.mnb-tab-panel[data-mid="' + menuId + '"]').remove();
            if (!$host.find('.mnb-tab-panel').length && this.$defaultContent.length) {
                this.$defaultContent.show();
            }
        }

        closeMenuTab(menuId, suppressActivate = false) {
            if (this.fixedFirstTabId && String(menuId) === String(this.fixedFirstTabId)) {
                return false;
            }

            let $li = this.$mnbList.find('li[data-mid="' + menuId + '"]');
            if (!$li.length) {
                return false;
            }

            let wasActive = $li.find('> a').hasClass('active');
            $li.remove();
            this.closeNthTab(menuId);
            this.removeContentPanel(menuId);

            if (!suppressActivate && wasActive) {
                let $last = this.$mnbList.find('li[data-mid]').last();
                if ($last.length) {
                    let $lastLink = $last.find('> a');
                    this.openMenu(
                        $lastLink.attr('data-mid'),
                        $lastLink.find('.mnb-tab-title').text().trim(),
                        $lastLink.attr('data-url')
                    );
                } else if (this.$defaultContent.length) {
                    this.$defaultContent.show();
                }
            }

            return true;
        }

        closeOtherTabs(currentId) {
            let _this = this;
            this.$mnbList.find('li[data-mid]').each(function () {
                let tabId = $(this).attr('data-mid');
                if (String(tabId) !== String(currentId) && String(tabId) !== String(_this.fixedFirstTabId)) {
                    _this.closeMenuTab(tabId, true);
                }
            });

            let $current = this.$mnbList.find('li[data-mid="' + currentId + '"] > a');
            if ($current.length) {
                this.openMenu(
                    $current.attr('data-mid'),
                    $current.find('.mnb-tab-title').text().trim(),
                    $current.attr('data-url')
                );
            }
        }

        closeAllTabs() {
            let _this = this;
            this.$mnbList.find('li[data-mid]').each(function () {
                let tabId = $(this).attr('data-mid');
                if (String(tabId) !== String(_this.fixedFirstTabId)) {
                    _this.closeMenuTab(tabId, true);
                }
            });

            if (this.fixedFirstTabId) {
                let $fixed = this.$mnbList.find('li[data-mid="' + this.fixedFirstTabId + '"] > a');
                if ($fixed.length) {
                    this.openMenu(
                        $fixed.attr('data-mid'),
                        $fixed.find('.mnb-tab-title').text().trim(),
                        $fixed.attr('data-url')
                    );
                    return;
                }
            }

            if (this.$defaultContent.length) {
                this.$defaultContent.show();
            }
        }

        openTabInPopup(menuId) {
            let $tab = this.$mnbList.find('li[data-mid="' + menuId + '"] > a');
            if (!$tab.length) {
                return;
            }

            let url = ($tab.attr('data-url') || '').toString().trim();
            if (url === '' || url === '#') {
                return;
            }

            let popupFeatures = [
                'popup=yes',
                'menubar=no',
                'toolbar=no',
                'location=no',
                'status=no',
                'scrollbars=yes',
                'resizable=yes',
                'width=1400',
                'height=900'
            ].join(',');

            let win = window.open(url, '_blank', popupFeatures);
            if (win) {
                win.focus();
            }
        }

        setActiveMnbTab(menuId) {
            this.$mnbList.find('a').removeClass('active');
            this.$mnbList.find('li[data-mid="' + menuId + '"] > a').addClass('active');
        }

        syncLeftMenuState(menuId) {
            let targetId = String(menuId || '').trim();
            if (targetId === '') {
                return;
            }

            let $menuLinks = this.$leftSideNavi.find('.menu-leaf-link');
            $menuLinks.removeClass('active');

            let $targetLink = $menuLinks.filter(function () {
                let mid = ($(this).data('mid') || '').toString().trim();
                return mid === targetId;
            }).first();

            if (!$targetLink.length) {
                return;
            }

            $targetLink.addClass('active');
            this.$leftSideNavi.find('.side-nav-item').removeClass('menuitem-active');
            let $topSideItem = $targetLink.closest('.side-nav-item');
            $topSideItem.addClass('menuitem-active');

            let $topCollapse = $targetLink.closest('.side-nav-item[level="0"]').children('.collapse[level="0"]').first();
            let $allTopCollapses = this.$leftSideNavi.find('.side-nav > .side-nav-item[level="0"] > .collapse[level="0"]');
            $allTopCollapses.not($topCollapse).not('#bookmarkFolder').each(function () {
                $(this).removeClass('show').attr('aria-expanded', 'false');
                $(this).prev('[data-bs-toggle="collapse"]').attr('aria-expanded', 'false');
            });

            if ($topCollapse.length) {
                $topCollapse.addClass('show').attr('aria-expanded', 'true');
                $topCollapse.prev('[data-bs-toggle="collapse"]').attr('aria-expanded', 'true');
            }

            this.$leftSideNavi.find('.side-nav-second-level .collapse').removeClass('show').attr('aria-expanded', 'false');
            this.$leftSideNavi.find('.side-nav-second-level [data-bs-toggle="collapse"]').attr('aria-expanded', 'false');

            // 4단계 잎이면 중분류·대분류 펼침을 모두 연다
            let $nestedCollapse = $targetLink.parents('.side-nav-second-level .collapse');
            if ($nestedCollapse.length) {
                $nestedCollapse.addClass('show').attr('aria-expanded', 'true');
                $nestedCollapse.prev('[data-bs-toggle="collapse"]').attr('aria-expanded', 'true');
            }
        }

        resetMenuCollapseState() {
            this.resetCondensedFlyoutState();
            let $topCollapses = this.$leftSideNavi.children('.side-nav-item[level="0"]').children('.collapse[level="0"]');
            $topCollapses.removeClass('show').attr('aria-expanded', 'false');
            $topCollapses.prev('[data-bs-toggle="collapse"]').attr('aria-expanded', 'false');

            this.$leftSideNavi.find('.side-nav-second-level .collapse').removeClass('show').attr('aria-expanded', 'false');
            this.$leftSideNavi.find('.side-nav-second-level [data-bs-toggle="collapse"]').attr('aria-expanded', 'false');
            this.$leftSideNavi.find('.side-nav-item').removeClass('menuitem-active');
            this.$leftSideNavi.find('.menu-leaf-link').removeClass('active');
        }

        bindTopFolderAccordionEvent() {
            let _this = this;

            this.$leftSideNavi.off('show.bs.collapse.topFolderAcc');
            this.$leftSideNavi.on('show.bs.collapse.topFolderAcc', '.side-nav-item[level="0"] > .collapse[level="0"]', function (e) {
                let $current = $(e.target);
                if (!$current.is('.side-nav-item[level="0"] > .collapse[level="0"]')) {
                    return;
                }

                let $others = _this.$leftSideNavi.children('.side-nav-item[level="0"]').children('.collapse[level="0"]').not($current);
                $others.each(function () {
                    if ($(this).hasClass('show') && typeof $(this).collapse === 'function') {
                        $(this).collapse('hide');
                    } else {
                        $(this).removeClass('show').attr('aria-expanded', 'false');
                        $(this).prev('[data-bs-toggle="collapse"]').attr('aria-expanded', 'false');
                    }
                });

                $others.find('.collapse.show').each(function () {
                    if (typeof $(this).collapse === 'function') {
                        $(this).collapse('hide');
                    } else {
                        $(this).removeClass('show').attr('aria-expanded', 'false');
                        $(this).prev('[data-bs-toggle="collapse"]').attr('aria-expanded', 'false');
                    }
                });
            });
        }

        scrollActiveMnbTabIntoView(menuId) {
            let $target = this.$mnbList.find('li[data-mid="' + menuId + '"]');
            if (!$target.length || !this.$mnbCenter.length) {
                return;
            }

            let centerEl = this.$mnbCenter.get(0);
            let targetEl = $target.get(0);
            let left = targetEl.offsetLeft - (centerEl.clientWidth / 2) + (targetEl.clientWidth / 2);
            centerEl.scrollTo({ left: Math.max(0, left), behavior: 'smooth' });
        }

        // 탭에 쓸 이름. 3단 메뉴는 잎 이름만으로는 구분이 안 된다 —
        // 검사항목이 둘이면 '라벨링 작업' 탭이 두 개 생긴다. 템플릿이 실어 준
        // data-tab-title('검사항목명 · 잎 이름')을 우선한다.
        leafTitle($menu) {
            let title = ($menu.attr('data-tab-title') || '').toString().trim();
            return title !== '' ? title : $menu.text().trim();
        }

        openMenu(menuId, menuTitle, menuUrl, options = {}) {
            if (!menuId || !menuUrl || menuUrl === '#') {
                return;
            }

            let isFixedFirst = options && options.isFixedFirst === true;
            let navigateExisting = options && options.navigateExisting === true;
            let allowClose = !isFixedFirst && String(menuId) !== String(this.fixedFirstTabId);
            this.openNthTab(menuId, menuTitle, menuUrl, allowClose);
            this.ensureMnbTab(menuId, menuTitle, menuUrl, allowClose);
            this.ensureContentPanel(menuId, menuUrl, navigateExisting);
            this.setActiveMnbTab(menuId);
            this.syncLeftMenuState(menuId);
            this.activateContentPanel(menuId);
            this.scrollActiveMnbTabIntoView(menuId);
        }

        getDefaultMenuCode() {
            let defaultMenuCode = ($('#default_menu_code').val() || '').toString().trim();
            return defaultMenuCode;
        }

        findInitialMenuAnchor() {
            let defaultMenuCode = this.getDefaultMenuCode();
            let $menu = $();

            if (defaultMenuCode !== '') {
                $menu = this.$leftSideNavi.find('.menu-leaf-link').filter(function () {
                    let mid = ($(this).data('mid') || '').toString().trim();
                    return mid === defaultMenuCode;
                }).first();
            }

            if (!$menu.length) {
                $menu = this.$leftSideNavi.find('.menu-leaf-link').filter(function () {
                    let url = ($(this).data('url') || '').toString().trim();
                    return url !== '' && url !== '#';
                }).first();
            }

            return $menu;
        }

        initFixedFirstTab() {
            let $initialMenu = this.findInitialMenuAnchor();
            if (!$initialMenu.length) {
                return;
            }

            let menuId = ($initialMenu.data('mid') || '').toString().trim();
            let menuUrl = ($initialMenu.data('url') || '').toString().trim();
            let menuTitle = this.leafTitle($initialMenu);
            if (!menuId || !menuUrl || menuUrl === '#') {
                return;
            }

            this.fixedFirstTabId = menuId;
            let $parentCollapse = $initialMenu.closest('.collapse');
            if ($parentCollapse.length) {
                $parentCollapse.addClass('show');
                $parentCollapse.prev('[data-bs-toggle="collapse"]').attr('aria-expanded', 'true');
            }
            this.openMenu(menuId, menuTitle, menuUrl, { isFixedFirst: true });
        }

        hideContextMenu() {
            if (this.$contextMenu && this.$contextMenu.length) {
                this.$contextMenu.hide();
            }
            this.contextMenuTargetId = null;
        }

        showContextMenu(pageX, pageY, targetId) {
            if (!this.$contextMenu || !this.$contextMenu.length) {
                return;
            }

            this.contextMenuTargetId = targetId;
            let isFixed = this.fixedFirstTabId && String(targetId) === String(this.fixedFirstTabId);
            this.$contextMenu.find('[data-action="close-current"]').toggleClass('disabled', !!isFixed);

            this.$contextMenu.css({ left: pageX, top: pageY, display: 'block' });

            let menuEl = this.$contextMenu.get(0);
            let maxLeft = window.pageXOffset + window.innerWidth - menuEl.offsetWidth - 4;
            let maxTop = window.pageYOffset + window.innerHeight - menuEl.offsetHeight - 4;
            if (pageX > maxLeft) {
                this.$contextMenu.css('left', maxLeft);
            }
            if (pageY > maxTop) {
                this.$contextMenu.css('top', maxTop);
            }
        }

        bindSideMenuClickEvent() {
            let _this = this;
            this.$leftSideNavi
                .off('click', '.menu-leaf-link')
                .on('click', '.menu-leaf-link', function (e) {
                    e.preventDefault();

                    let $menu = $(this);
                    let menuId = ($menu.data('mid') || '').toString().trim();
                    let menuUrl = ($menu.data('url') || '').toString().trim();
                    let menuTitle = _this.leafTitle($menu);

                    _this.openMenu(menuId, menuTitle, menuUrl);
                });
        }

        // 접힌 사이드바 전용 동작을 적용할 화면 상태인지 판별한다.
        // topnav 레이아웃에는 같은 메뉴 DOM이 있어도 flyout을 적용하지 않는다.
        isCondensedSidenav() {
            let htmlEl = document.documentElement;
            return htmlEl.getAttribute('data-sidenav-size') === 'condensed'
                && htmlEl.getAttribute('data-layout') !== 'topnav';
        }

        // 실제 스크롤을 담당하는 SimpleBar 요소를 찾는다.
        // SimpleBar가 아직 만들어지지 않았으면 메뉴 컨테이너를 대체 요소로 사용한다.
        getLeftMenuScrollElement() {
            return $('#leftside-menu-container .simplebar-content-wrapper').get(0)
                || $('#leftside-menu-container').get(0);
        }

        // 접힌 메뉴의 실제 스크롤 비율을 SimpleBar 손잡이 크기와 위치에 동기화한다.
        // 자동 계산이 늦는 경우에도 긴 메뉴의 스크롤 가능 상태가 바로 보이게 한다.
        syncCondensedLeftMenuScrollbar() {
            let menuEl = document.getElementById('leftside-menu-container');
            let scrollEl = this.getLeftMenuScrollElement();
            if (!menuEl || !scrollEl) {
                return;
            }

            let scrollable = scrollEl.scrollHeight > scrollEl.clientHeight + 1;
            menuEl.classList.toggle('mnb-condensed-scrollable', this.isCondensedSidenav() && scrollable);
            if (!this.isCondensedSidenav()) {
                return;
            }

            let trackEl = menuEl.querySelector('.simplebar-track.simplebar-vertical');
            let scrollbarEl = trackEl ? trackEl.querySelector('.simplebar-scrollbar') : null;
            if (!trackEl || !scrollbarEl || !scrollable) {
                return;
            }

            let trackHeight = trackEl.clientHeight || scrollEl.clientHeight;
            let scrollRange = scrollEl.scrollHeight - scrollEl.clientHeight;
            let scrollbarHeight = Math.max(24, Math.round((scrollEl.clientHeight / scrollEl.scrollHeight) * trackHeight));
            let scrollbarTop = Math.round((scrollEl.scrollTop / scrollRange) * Math.max(0, trackHeight - scrollbarHeight));

            menuEl.style.setProperty('--mnb-condensed-scrollbar-height', scrollbarHeight + 'px');
            menuEl.style.setProperty('--mnb-condensed-scrollbar-top', scrollbarTop + 'px');
            trackEl.style.visibility = 'visible';
            scrollbarEl.style.display = 'block';
            scrollbarEl.style.height = scrollbarHeight + 'px';
            scrollbarEl.style.transform = 'translate3d(0px, ' + scrollbarTop + 'px, 0px)';
        }

        // 메뉴 내용이나 접힘 상태가 바뀐 뒤 SimpleBar의 크기를 다시 계산한다.
        // 즉시 계산과 다음 이벤트 루프 계산을 함께 수행해 DOM 배치 지연을 흡수한다.
        recalculateLeftMenuSimpleBar() {
            let _this = this;
            let menuEl = document.getElementById('leftside-menu-container');
            if (!menuEl || typeof SimpleBar === 'undefined') {
                return;
            }

            try {
                let instance = SimpleBar.instances && SimpleBar.instances.get(menuEl);
                if (!instance) {
                    instance = new SimpleBar(menuEl);
                }
                if (instance && typeof instance.recalculate === 'function') {
                    instance.recalculate();
                    _this.syncCondensedLeftMenuScrollbar();
                    window.setTimeout(function () {
                        instance.recalculate();
                        _this.syncCondensedLeftMenuScrollbar();
                    }, 0);
                }
            } catch (err) {
                console.log('recalculateLeftMenuSimpleBar error', err);
            }
        }

        // 지정 범위의 flyout 배치 클래스와 좌표 CSS 변수를 함께 제거한다.
        // 이전 메뉴의 고정 좌표가 다음 hover에 재사용되는 것을 막는다.
        clearCondensedSideMenuFlyout($scope) {
            let $target = ($scope && $scope.length) ? $scope : this.$leftSideNavi.add(this.$bookmarkNavi);
            $target.find('.mnb-flyout-above').addBack('.mnb-flyout-above').removeClass('mnb-flyout-above');
            $target.find('.mnb-condensed-flyout-positioned')
                .addBack('.mnb-condensed-flyout-positioned')
                .removeClass('mnb-condensed-flyout-positioned')
                .each(function () {
                    this.style.removeProperty('--mnb-condensed-link-top');
                    this.style.removeProperty('--mnb-condensed-link-height');
                    this.style.removeProperty('--mnb-condensed-flyout-top');
                    this.style.removeProperty('--mnb-condensed-flyout-max-height');
                });
            $target.find('.mnb-condensed-subflyout-positioned')
                .addBack('.mnb-condensed-subflyout-positioned')
                .removeClass('mnb-condensed-subflyout-positioned')
                .each(function () {
                    this.style.removeProperty('--mnb-condensed-subflyout-left');
                    this.style.removeProperty('--mnb-condensed-subflyout-header-top');
                    this.style.removeProperty('--mnb-condensed-subflyout-header-height');
                    this.style.removeProperty('--mnb-condensed-subflyout-top');
                    this.style.removeProperty('--mnb-condensed-subflyout-max-height');
                });
        }

        // flyout의 자연 높이와 각 메뉴 행의 끝 경계를 측정한다.
        // 높이를 줄일 때 글자가 반쯤 잘린 행 대신 완전히 보이는 행까지만 남기기 위한 값이다.
        getCondensedFlyoutMetrics(menuEl) {
            let menuStyle = getComputedStyle(menuEl);
            let menuRect = menuEl.getBoundingClientRect();
            let borderTop = parseFloat(menuStyle.borderTopWidth) || 0;
            let borderBottom = parseFloat(menuStyle.borderBottomWidth) || 0;
            let paddingTop = parseFloat(menuStyle.paddingTop) || 0;
            let paddingBottom = parseFloat(menuStyle.paddingBottom) || 0;
            let rowBoundaries = Array.from(menuEl.children)
                .filter(function (child) { return child.tagName === 'LI'; })
                .map(function (child) {
                    return child.getBoundingClientRect().bottom - menuRect.top + menuEl.scrollTop + borderBottom;
                })
                .filter(function (boundary) { return boundary > 0; });
            let minimumViewportHeight = borderTop + paddingTop + borderBottom;
            let measuredHeight = rowBoundaries.length
                ? rowBoundaries[rowBoundaries.length - 1] + paddingBottom
                : minimumViewportHeight + paddingBottom;

            return {
                naturalHeight: measuredHeight || Math.max(menuEl.scrollHeight || 0, menuEl.offsetHeight || 0),
                rowBoundaries: rowBoundaries,
                minimumViewportHeight: minimumViewportHeight
            };
        }

        // 사용 가능한 공간 안에서 완전히 표시할 수 있는 마지막 행 경계로 높이를 맞춘다.
        // 전체 메뉴가 들어가면 원래 높이를 그대로 유지한다.
        fitCondensedFlyoutHeight(metrics, availableHeight) {
            if (metrics.naturalHeight <= availableHeight) {
                return metrics.naturalHeight;
            }

            let fittedHeight = metrics.minimumViewportHeight;
            let visibleRows = 0;
            metrics.rowBoundaries.some(function (rowBoundary) {
                if (rowBoundary > availableHeight) {
                    return true;
                }
                fittedHeight = rowBoundary;
                visibleRows += 1;
                return false;
            });
            return visibleRows
                ? Math.min(availableHeight, fittedHeight)
                : Math.min(availableHeight, metrics.minimumViewportHeight);
        }

        // 기준 메뉴의 위·아래 공간을 비교해 flyout 방향과 최대 높이를 정한다.
        // 아래 공간이 부족하고 위가 더 넓으면 메뉴를 위쪽으로 연다.
        getCondensedFlyoutPlacement(anchorRect, menuEl, forceOpenAbove) {
            let rootStyle = getComputedStyle(document.documentElement);
            let topbarHeight = parseFloat(rootStyle.getPropertyValue('--ct-topbar-height')) || 50;
            let viewportBottom = window.innerHeight - 8;
            let metrics = this.getCondensedFlyoutMetrics(menuEl);
            let availableBelow = Math.max(0, viewportBottom - anchorRect.bottom);
            let availableAbove = Math.max(0, anchorRect.top - topbarHeight);
            let flyoutHeight;
            let top;
            let openAbove = false;

            if (forceOpenAbove || (metrics.naturalHeight > availableBelow && availableAbove > availableBelow)) {
                flyoutHeight = this.fitCondensedFlyoutHeight(metrics, availableAbove);
                top = anchorRect.top - flyoutHeight;
                openAbove = true;
            } else {
                flyoutHeight = this.fitCondensedFlyoutHeight(metrics, availableBelow);
                top = anchorRect.bottom;
            }

            return { top: Math.max(topbarHeight, top), maxHeight: flyoutHeight, openAbove: openAbove };
        }

        // 상위 메뉴 헤더를 기준으로 2단계 flyout의 고정 좌표를 계산한다.
        // fixed 전 높이를 CSS 변수로 보존해 헤더와 목록 사이의 픽셀 틈을 막는다.
        positionCondensedSideMenuFlyout(item) {
            let itemEl = $(item).get(0);
            if (!this.isCondensedSidenav() || !itemEl) {
                return;
            }
            let linkEl = itemEl.querySelector(':scope > .side-nav-link');
            let menuEl = itemEl.querySelector(':scope > .collapse > ul, :scope > .collapsing > ul');
            if (!linkEl) {
                return;
            }

            let linkRect = linkEl.getBoundingClientRect();
            itemEl.style.setProperty('--mnb-condensed-link-top', linkRect.top + 'px');
            itemEl.style.setProperty('--mnb-condensed-link-height', linkRect.height + 'px');
            // 하위 목록이 없는 1단계 링크(대시보드)는 이름 줄만 사이드바 밖으로 꺼낸다 — 스크롤 영역에 잘리지 않게
            if (menuEl) {
                let placement = this.getCondensedFlyoutPlacement(linkRect, menuEl);
                itemEl.classList.toggle('mnb-flyout-above', placement.openAbove);
                if (placement.openAbove) {
                    placement = this.getCondensedFlyoutPlacement(linkRect, menuEl, true);
                }
                itemEl.style.setProperty('--mnb-condensed-flyout-top', placement.top + 'px');
                itemEl.style.setProperty('--mnb-condensed-flyout-max-height', placement.maxHeight + 'px');
            }
            itemEl.classList.add('mnb-condensed-flyout-positioned');
        }

        // 선택한 2단계 폴더 오른쪽에 자손 flyout의 헤더와 목록을 배치한다.
        // 현재 열린 상위 flyout 안의 항목만 좌표 계산 대상으로 허용한다.
        positionCondensedSubMenuFlyout(item) {
            let itemEl = $(item).get(0);
            let rootEl = this.$condensedOpenItem && this.$condensedOpenItem.get(0);
            if (!this.isCondensedSidenav() || !itemEl || !rootEl || !rootEl.contains(itemEl)) {
                return;
            }
            let linkEl = itemEl.querySelector(':scope > a');
            let menuEl = itemEl.querySelector(':scope > .collapse > ul, :scope > .collapsing > ul');
            if (!linkEl || !menuEl) {
                return;
            }

            let parentMenu = itemEl.closest('.side-nav-second-level, .side-nav-third-level');
            let linkRect = linkEl.getBoundingClientRect();
            let placement = this.getCondensedFlyoutPlacement(linkRect, menuEl);
            itemEl.classList.toggle('mnb-flyout-above', placement.openAbove);
            if (placement.openAbove) {
                placement = this.getCondensedFlyoutPlacement(linkRect, menuEl, true);
            }
            itemEl.style.setProperty('--mnb-condensed-subflyout-left', (parentMenu ? parentMenu.getBoundingClientRect().right : linkRect.right) + 'px');
            itemEl.style.setProperty('--mnb-condensed-subflyout-header-top', linkRect.top + 'px');
            itemEl.style.setProperty('--mnb-condensed-subflyout-header-height', linkRect.height + 'px');
            itemEl.style.setProperty('--mnb-condensed-subflyout-top', placement.top + 'px');
            itemEl.style.setProperty('--mnb-condensed-subflyout-max-height', placement.maxHeight + 'px');
            itemEl.classList.add('mnb-condensed-subflyout-positioned');
        }

        // 접힌 메뉴의 상위 flyout을 하나만 열고 현재 위치로 다시 배치한다.
        // 다른 상위 메뉴가 열려 있으면 기존 상태를 먼저 모두 정리한다.
        openCondensedFlyout(item) {
            if (!this.isCondensedSidenav()) {
                return;
            }
            let itemEl = $(item).get(0);
            if (!itemEl || !itemEl.isConnected) {
                return;
            }
            if (this.$condensedOpenItem && this.$condensedOpenItem.get(0) !== itemEl) {
                this.resetCondensedFlyoutState();
            }
            this.$condensedOpenItem = $(itemEl);
            itemEl.classList.add('mnb-flyout-open');
            this.positionCondensedSideMenuFlyout(itemEl);
        }

        // 자손 목록을 가진 2단계 폴더의 flyout을 하나만 연다.
        // 이전 자손 flyout의 상태와 좌표를 지운 뒤 새 항목을 배치한다.
        openCondensedSubFlyout(item) {
            let itemEl = $(item).get(0);
            if (!itemEl || !itemEl.querySelector(':scope > .collapse > ul')) {
                return;
            }
            if (this.$condensedOpenSubItem && this.$condensedOpenSubItem.get(0) !== itemEl) {
                this.$condensedOpenSubItem.removeClass('mnb-subflyout-open');
                this.clearCondensedSideMenuFlyout(this.$condensedOpenSubItem);
            }
            this.$condensedOpenSubItem = $(itemEl).addClass('mnb-subflyout-open');
            this.positionCondensedSubMenuFlyout(itemEl);
        }

        // 예약된 열기·닫기 작업과 모든 flyout 표시·좌표 상태를 초기화한다.
        // 화면 크기나 스크롤 위치가 바뀐 뒤 낡은 좌표가 남지 않게 한다.
        resetCondensedFlyoutState() {
            window.clearTimeout(this.condensedOpenTimer);
            window.clearTimeout(this.condensedCloseTimer);
            window.clearTimeout(this.condensedSubCloseTimer);
            this.condensedOpenTimer = null;
            this.condensedCloseTimer = null;
            this.condensedSubCloseTimer = null;
            this.$leftSideNavi.add(this.$bookmarkNavi)
                .find('.mnb-flyout-open, .mnb-subflyout-open')
                .removeClass('mnb-flyout-open mnb-subflyout-open');
            this.clearCondensedSideMenuFlyout();
            this.$condensedOpenItem = null;
            this.$condensedOpenSubItem = null;
        }

        // 접힌 메뉴의 상위·자손 hover와 화면 상태 변경 이벤트를 연결한다.
        // 이동 유예, 좌표 초기화, SimpleBar 재계산을 한 곳에서 관리한다.
        bindCondensedSideMenuFlyoutEvent() {
            let _this = this;
            let $navs = this.$leftSideNavi.add(this.$bookmarkNavi);
            let OPEN_DELAY = 150;
            let CLOSE_DELAY = 300;

            // 1단계: 상위 메뉴 진입과 이탈에 짧은 유예를 둬 대각선 이동 중 깜빡임을 막는다.
            $navs
                .off('mouseenter.condensedFlyout', '.side-nav-item[level="0"]')
                .on('mouseenter.condensedFlyout', '.side-nav-item[level="0"]', function () {
                    if (!_this.isCondensedSidenav()) return;
                    let item = this;
                    window.clearTimeout(_this.condensedOpenTimer);
                    window.clearTimeout(_this.condensedCloseTimer);
                    let delay = _this.$condensedOpenItem ? OPEN_DELAY : 0;
                    _this.condensedOpenTimer = window.setTimeout(function () {
                        _this.openCondensedFlyout(item);
                    }, delay);
                })
                .off('mouseleave.condensedFlyout', '.side-nav-item[level="0"]')
                .on('mouseleave.condensedFlyout', '.side-nav-item[level="0"]', function () {
                    if (!_this.isCondensedSidenav()) return;
                    window.clearTimeout(_this.condensedOpenTimer);
                    _this.condensedCloseTimer = window.setTimeout(function () {
                        _this.resetCondensedFlyoutState();
                    }, CLOSE_DELAY);
                });

            // 2단계: 하위 폴더는 별도 flyout으로 열고, 잎 메뉴에 닿으면 기존 하위 flyout을 닫는다.
            $navs
                .off('mouseenter.condensedSubFlyout', '.side-nav-second-level > li')
                .on('mouseenter.condensedSubFlyout', '.side-nav-second-level > li', function () {
                    if (!_this.isCondensedSidenav()) return;
                    if (this.querySelector(':scope > .collapse > ul')) {
                        _this.openCondensedSubFlyout(this);
                    } else if (_this.$condensedOpenSubItem) {
                        _this.$condensedOpenSubItem.removeClass('mnb-subflyout-open');
                        _this.clearCondensedSideMenuFlyout(_this.$condensedOpenSubItem);
                        _this.$condensedOpenSubItem = null;
                    }
                });

            // 3단계: 크기·접힘 상태·스크롤이 바뀌면 좌표를 폐기하고 다음 진입 때 다시 계산한다.
            $(window).off('resize.condensedFlyout').on('resize.condensedFlyout', function () {
                _this.resetCondensedFlyoutState();
                _this.recalculateLeftMenuSimpleBar();
            });
            if (this.condensedSidenavObserver) {
                this.condensedSidenavObserver.disconnect();
            }
            this.condensedSidenavObserver = new MutationObserver(function () {
                _this.resetCondensedFlyoutState();
                _this.recalculateLeftMenuSimpleBar();
            });
            this.condensedSidenavObserver.observe(document.documentElement, {
                attributes: true,
                attributeFilter: ['data-sidenav-size']
            });

            let bindScrollReset = function () {
                $('#leftside-menu-container .simplebar-content-wrapper')
                    .off('scroll.condensedFlyout')
                    .on('scroll.condensedFlyout', function () {
                        _this.syncCondensedLeftMenuScrollbar();
                        _this.resetCondensedFlyoutState();
                    });
            };
            bindScrollReset();
            window.setTimeout(bindScrollReset, 0);
        }

        // 휠 입력을 커서 아래 flyout 또는 왼쪽 메뉴의 실제 스크롤 요소로 전달한다.
        // 바깥 페이지로 휠이 전파되어 메뉴와 본문이 함께 움직이는 것을 막는다.
        bindCondensedSideMenuWheelEvent() {
            let _this = this;
            $('.leftside-menu').off('wheel.condensedSideMenu').on('wheel.condensedSideMenu', function (e) {
                if (!_this.isCondensedSidenav()) return;
                let event = e.originalEvent;
                if (!event || event.ctrlKey || event.metaKey || !event.deltaY) return;

                let flyoutEl = $(e.target).closest('.side-nav-second-level, .side-nav-third-level').get(0);
                if (flyoutEl) {
                    if (flyoutEl.scrollHeight > flyoutEl.clientHeight) {
                        flyoutEl.scrollTop += event.deltaY;
                    }
                    event.preventDefault();
                    event.stopPropagation();
                    return false;
                }

                let scrollEl = _this.getLeftMenuScrollElement();
                if (scrollEl && scrollEl.scrollHeight > scrollEl.clientHeight) {
                    scrollEl.scrollTop += event.deltaY;
                    _this.resetCondensedFlyoutState();
                    event.preventDefault();
                    event.stopPropagation();
                    return false;
                }
            });
        }

        bindMnbTabEvent() {
            let _this = this;

            this.$mnbPage
                .off('click', '.mnb-tab-link')
                .on('click', '.mnb-tab-link', function (e) {
                    if ($(e.target).closest('button.close').length > 0) {
                        return;
                    }
                    e.preventDefault();

                    let $tab = $(this);
                    let menuId = $tab.attr('data-mid');
                    let menuUrl = $tab.attr('data-url');
                    let menuTitle = $tab.find('.mnb-tab-title').text().trim();

                    _this.openMenu(menuId, menuTitle, menuUrl);
                });

            this.$mnbPage
                .off('click', '.mnb-list button.close')
                .on('click', '.mnb-list button.close', function (e) {
                    e.preventDefault();
                    e.stopPropagation();

                    let $li = $(this).closest('li[data-mid]');
                    let closedId = $li.attr('data-mid');
                    _this.closeMenuTab(closedId);
                });

            this.$mnbPage
                .off('contextmenu', '.mnb-list li')
                .on('contextmenu', '.mnb-list li', function (e) {
                    e.preventDefault();
                    let targetId = $(this).attr('data-mid');
                    _this.showContextMenu(e.pageX, e.pageY, targetId);
                    return false;
                });

            if (this.$contextMenu && this.$contextMenu.length) {
                this.$contextMenu
                    .off('click', 'li[data-action]')
                    .on('click', 'li[data-action]', function (e) {
                        e.preventDefault();
                        let $item = $(this);
                        if ($item.hasClass('disabled')) {
                            return;
                        }

                        let action = $item.attr('data-action');
                        let targetId = _this.contextMenuTargetId;
                        if (!targetId) {
                            _this.hideContextMenu();
                            return;
                        }

                        if (action === 'open-new-window') {
                            _this.openTabInPopup(targetId);
                        } else if (action === 'close-current') {
                            _this.closeMenuTab(targetId);
                        } else if (action === 'close-others') {
                            _this.closeOtherTabs(targetId);
                        } else if (action === 'close-all') {
                            _this.closeAllTabs();
                        }

                        _this.hideContextMenu();
                    });
            }

            $(document).off('click.mnbctx').on('click.mnbctx', function () {
                _this.hideContextMenu();
            });

            $(window).off('resize.mnbctx scroll.mnbctx').on('resize.mnbctx scroll.mnbctx', function () {
                _this.hideContextMenu();
            });

            this.$mnbPage.find('.mnb-scroll-left').off('click').on('click', function () {
                if (_this.$mnbCenter.length) {
                    _this.$mnbCenter.get(0).scrollBy({ left: -180, behavior: 'smooth' });
                }
            });

            this.$mnbPage.find('.mnb-scroll-right').off('click').on('click', function () {
                if (_this.$mnbCenter.length) {
                    _this.$mnbCenter.get(0).scrollBy({ left: 180, behavior: 'smooth' });
                }
            });

        getTopSearchMenuItems() {
            let _this = this;
            let menuItems = [];
            this.$leftSideNavi.find('.menu-leaf-link').each(function () {
                let $menu = $(this);
                let menuId = ($menu.data('mid') || '').toString().trim();
                let menuUrl = ($menu.data('url') || '').toString().trim();
                let menuTitle = _this.leafTitle($menu);

                if (!menuId || !menuUrl || menuUrl === '#' || !menuTitle) {
                    return;
                }

                menuItems.push({
                    label: menuTitle,
                    value: menuTitle,
                    menuId: menuId,
                    menuUrl: menuUrl
                });
            });
            return menuItems;
        }

        clickLeftMenuLink(menuId) {
            let targetId = (menuId || '').toString().trim();
            if (!targetId) {
                return false;
            }

            let $targetMenu = this.$leftSideNavi.find('.menu-leaf-link').filter(function () {
                let mid = ($(this).data('mid') || '').toString().trim();
                return mid === targetId;
            }).first();

            if (!$targetMenu.length) {
                return false;
            }

            $targetMenu.trigger('click');

            // trigger click이 환경에 따라 누락될 수 있어 동일 메뉴 오픈을 보장
            let menuTitle = this.leafTitle($targetMenu);
            let menuUrl = ($targetMenu.data('url') || '').toString().trim();
            this.openMenu(targetId, menuTitle, menuUrl);
            return true;
        }

        bindTopSearchAutocomplete() {
            let _this = this;
            let $topSearch = $('#top-search');
            if (!$topSearch.length) {
                return;
            }

            let $form = $topSearch.closest('form');
            let $inputGroup = $topSearch.closest('.input-group');
            let $anchor = $inputGroup.length ? $inputGroup : $topSearch;

            let $resultBox = $('#top-search-result');
            if (!$resultBox.length) {
                $resultBox = $('<div id="top-search-result"></div>').css({
                    'display': 'none',
                    'position': 'fixed',
                    'left': 0,
                    'top': 0,
                    'width': '320px',
                    'z-index': 3000,
                    'max-height': '260px',
                    'overflow-y': 'auto',
                    'background-color': '#fff',
                    'color': '#1f2937',
                    'border': '1px solid #ced4da',
                    'border-radius': '6px',
                    'box-shadow': '0 6px 18px rgba(0,0,0,0.12)'
                });
                $('body').append($resultBox);
            } else {
                $resultBox.hide().empty();
            }

            $topSearch.attr('autocomplete', 'off');

            let positionResultBox = function () {
                if (!$anchor.length) {
                    return;
                }
                let rect = $anchor.get(0).getBoundingClientRect();
                $resultBox.css({
                    'left': rect.left + 'px',
                    'top': (rect.bottom + 4) + 'px',
                    'width': rect.width + 'px'
                });
            };

            let currentItems = [];
            let activeIndex = -1;

            let hideResult = function () {
                currentItems = [];
                activeIndex = -1;
                $resultBox.hide().empty();
            };

            let updateActiveItem = function () {
                let $items = $resultBox.find('.top-search-item');
                $items.css({
                    'background-color': '#fff',
                    'color': '#1f2937'
                });
                if (activeIndex >= 0 && activeIndex < $items.length) {
                    $items.eq(activeIndex).css({
                        'background-color': '#e9ecef',
                        'color': '#111827'
                    });
                }
            };

            let selectByIndex = function (index) {
                if (index < 0 || index >= currentItems.length) {
                    return false;
                }

                let item = currentItems[index];
                if (_this.clickLeftMenuLink(item.menuId)) {
                    $topSearch.val('');
                    hideResult();
                    return true;
                }
                return false;
            };

            let renderResult = function (keyword) {
                let term = (keyword || '').toString().trim().toLowerCase();
                if (!term) {
                    hideResult();
                    return;
                }

                let menuItems = _this.getTopSearchMenuItems();
                currentItems = menuItems.filter(function (item) {
                    return item.label.toLowerCase().indexOf(term) > -1;
                }).slice(0, 20);

                if (!currentItems.length) {
                    hideResult();
                    return;
                }

                let $list = $('<ul></ul>').css({
                    'list-style': 'none',
                    'margin': 0,
                    'padding': 0
                });

                currentItems.forEach(function (item, idx) {
                    let $li = $('<li class="top-search-item"></li>')
                        .attr('data-index', idx)
                        .attr('data-mid', item.menuId)
                        .text(item.label)
                        .css({
                            'padding': '6px 10px',
                            'cursor': 'pointer',
                            'color': '#1f2937',
                            'border-bottom': (idx === currentItems.length - 1) ? 'none' : '1px solid #eceff1',
                            'line-height': '1.2'
                        });
                    $list.append($li);
                });

                activeIndex = -1;
                positionResultBox();
                $resultBox.empty().append($list).show();
            };

            $resultBox
                .off('mouseenter.topSearch', '.top-search-item')
                .on('mouseenter.topSearch', '.top-search-item', function () {
                    activeIndex = parseInt($(this).attr('data-index'), 10);
                    updateActiveItem();
                });

            $resultBox
                .off('click.topSearch', '.top-search-item')
                .on('click.topSearch', '.top-search-item', function (e) {
                    e.preventDefault();
                    let index = parseInt($(this).attr('data-index'), 10);
                    selectByIndex(index);
                });

            $topSearch
                .off('input.topSearch keyup.topSearch compositionend.topSearch')
                .on('input.topSearch compositionend.topSearch', function () {
                    renderResult($(this).val());
                });

            $topSearch
                .off('focus.topSearch')
                .on('focus.topSearch', function () {
                    renderResult($(this).val());
                });

            $topSearch
                .off('keydown.topSearch')
                .on('keydown.topSearch', function (e) {
                    if (!$resultBox.is(':visible') || !currentItems.length) {
                        if (e.key === 'ArrowDown') {
                            renderResult($(this).val());
                            e.preventDefault();
                        }
                        return;
                    }

                    if (e.key === 'ArrowDown') {
                        e.preventDefault();
                        activeIndex = (activeIndex + 1) % currentItems.length;
                        updateActiveItem();
                    } else if (e.key === 'ArrowUp') {
                        e.preventDefault();
                        activeIndex = (activeIndex <= 0) ? currentItems.length - 1 : activeIndex - 1;
                        updateActiveItem();
                    } else if (e.key === 'Enter') {
                        e.preventDefault();
                        if (activeIndex >= 0) {
                            selectByIndex(activeIndex);
                        } else {
                            selectByIndex(0);
                        }
                    } else if (e.key === 'Escape') {
                        hideResult();
                    }
                });

            $form.off('submit.topSearch').on('submit.topSearch', function (e) {
                e.preventDefault();

                if (currentItems.length) {
                    if (activeIndex >= 0) {
                        selectByIndex(activeIndex);
                    } else {
                        selectByIndex(0);
                    }
                    return;
                }

                let term = ($topSearch.val() || '').toString().trim().toLowerCase();
                if (!term) {
                    hideResult();
                    return;
                }

                let menuItems = _this.getTopSearchMenuItems();
                let matchedItems = menuItems.filter(function (item) {
                    return item.label.toLowerCase().indexOf(term) > -1;
                });
                if (matchedItems.length) {
                    _this.clickLeftMenuLink(matchedItems[0].menuId);
                    $topSearch.val('');
                }
                hideResult();
            });

            $(window).off('resize.topSearch scroll.topSearch').on('resize.topSearch scroll.topSearch', function () {
                if ($resultBox.is(':visible')) {
                    positionResultBox();
                }
            });

            $(document).off('mousedown.topSearch').on('mousedown.topSearch', function (e) {
                if ($(e.target).closest('#top-search-result').length === 0 && $(e.target).closest($form).length === 0) {
                    hideResult();
                }
            });
        }
