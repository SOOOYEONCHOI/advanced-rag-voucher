    <script type="text/javascript">


        $(document).ready(function () {

            // 메뉴 설정
            i18n.initializeMenuData(i18n.getLanguageCode());
            window.myMenu = new LeftMenuClass();
            window.myMenu.init();

            // 메뉴 탭: 전체메뉴 / 즐겨찾기
            (function () {
                var $tabAll = $('#tabAllMenu');
                var $tabMy = $('#tabMyMenu');
                var $navAll = $('#sideNavAll');
                var $navBm = $('#sideNavBookmark');

                $tabAll.text(i18n.getMenuText('전체메뉴'));
                $tabMy.text(i18n.getMenuText('즐겨찾기'));

                function setActiveTab($active, $inactive, $showNav, $hideNav) {
                    window.myMenu.resetCondensedFlyoutState();
                    $active.css({ color: '#fff', borderBottom: '2px solid #ffc107' });
                    $inactive.css({ color: 'rgba(255,255,255,0.5)', borderBottom: '2px solid transparent' });
                    $showNav.show();
                    $hideNav.hide();
                    window.myMenu.recalculateLeftMenuSimpleBar();
                }

                function loadBookmarkMenu() {
                    $navBm.empty();
                    AjaxUtil.getAsyncData('/api/system/bookmark', {}, function (bookmarks) {
                        if (!Array.isArray(bookmarks) || bookmarks.length === 0) {
                            $navBm.html('<li style="padding:20px; text-align:center; color:rgba(255,255,255,0.4); font-size:12px;">등록된 즐겨찾기가 없습니다.</li>');
                            window.myMenu.recalculateLeftMenuSimpleBar();
                            return;
                        }
                        for (var i = 0; i < bookmarks.length; i++) {
                            var bm = bookmarks[i];
                            var bmName = i18n.getMenuText(bm.name || bm.code);
                            $navBm.append(
                                '<li class="side-nav-item">' +
                                '<a href="javascript:void(0);" class="side-nav-link menu-leaf-link" data-url="/gui/' + bm.code + '/default" data-mid="' + bm.code + '">' +
                                '<i class="uil uil-star" style="color:#ffc107;"></i> <span>' + bmName + '</span>' +
                                '</a></li>'
                            );
                        }
                        // 즐겨찾기 메뉴 클릭 이벤트 바인딩
                        $navBm.off('click', '.menu-leaf-link').on('click', '.menu-leaf-link', function (e) {
                            e.preventDefault();
                            var menuId = ($(this).data('mid') || '').toString().trim();
                            var menuUrl = ($(this).data('url') || '').toString().trim();
                            var menuTitle = $(this).text().trim();
                            window.myMenu.openMenu(menuId, menuTitle, menuUrl);
                        });
                        window.myMenu.recalculateLeftMenuSimpleBar();
                    }, function () { });
                }

                $tabAll.on('click', function () {
                    setActiveTab($tabAll, $tabMy, $navAll, $navBm);
                });

                $tabMy.on('click', function () {
                    loadBookmarkMenu();
                    setActiveTab($tabMy, $tabAll, $navBm, $navAll);
                });

                // 즐겨찾기 갱신 함수를 전역에 노출
                window.refreshBookmarkTab = function () {
                    // 즐겨찾기 탭이 현재 활성이면 목록만 갱신, 아니면 탭 전환
                    if ($navBm.is(':visible')) {
                        loadBookmarkMenu();
                    } else {
                        loadBookmarkMenu();
                        setActiveTab($tabMy, $tabAll, $navBm, $navAll);
                    }
                };
            })();

            // 내정보 클릭
            $('#myinfo').on('click', function (e) {
                e.preventDefault();
                modal.open({
                    width: 400,
                    height: 500,
                    title: '내 정보',
                    iframe: {
                        method: 'get',
                        url: '/page/account/myinfo',
                        param: 'callBack=setPopUpResult&'
                    }
                });
                $(".profile_contbox").hide();
            });


            $('#logout').on('click', function (e) {
                e.preventDefault();
                Alert.confirm('', '로그아웃하시겠습니까?', function () {
                    i18n.resetData();
                    location.href = '/logout';
                });
            });

        });

    </script>
