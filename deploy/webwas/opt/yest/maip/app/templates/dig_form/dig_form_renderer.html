    /* 머리글 입력칸 — 테두리 없이 칸을 채우고(칸 안에 상자가 겹치지 않게) 밑줄로 입력할 곳을 보인다.
       포커스·마우스는 옅은 배경 + 진한 칸 테두리. 공통 .form-control(SF-Custom.css)의 32px 줄 높이·바깥 여백을 되돌린다 */

    .dig-form-table td.dig-form-fill > .form-control {
        width: 100%;

        /* 적는 줄 — 칸 테두리와 겹치지 않게 좌우 10px·아래 5px 안쪽에 긋는다 */
        background: transparent linear-gradient(var(--brand-line-strong), var(--brand-line-strong)) no-repeat left 10px bottom 5px / calc(100% - 20px) 1px;

    .dig-form-table td.dig-form-fill > textarea.form-control { resize: none; overflow: hidden; }

    /* 판정 라디오: 원과 라벨을 한 묶음으로(줄을 바꿔도 원이 라벨 옆에 붙는다) — Bootstrap form-check 는 원을 float 로 띄운다 */

    /* 1024 폭(탭 930px)에서 열이 많은 표가 넘치지 않게 칸 여백을 줄인다. 미디어 쿼리는 화면 iframe 의 폭을 본다 */

    /* 참고사진 본문 서식 — 편집기(Quill 2)가 클래스로 저장한 들여쓰기·정렬·목록을 작성·조회 화면에서도 보인다.
       quill.core.css 의 .ql-editor 규칙 중 툴바에 있는 것만 옮겼다. 글자 크기는 인라인 스타일이라 규칙이 없다 */

    .dig-form-photo ol { margin: 0; padding: 0; }
    .dig-form-photo p,

    .dig-form-photo ol { padding-left: 1.5em; }
    .dig-form-photo li { list-style-type: none; padding-left: 1.5em; position: relative; }

    .dig-form-photo li[data-list=bullet] > .ql-ui::before { content: '\2022'; }
    .dig-form-photo li[data-list] { counter-set: list-1 list-2 list-3 list-4 list-5 list-6 list-7 list-8; }
    .dig-form-photo li[data-list=ordered] { counter-increment: list-0; }

    .dig-form-photo li[data-list=ordered].ql-indent-1 > .ql-ui::before { content: counter(list-1, lower-alpha) '. '; }
    .dig-form-photo .ql-indent-2 { padding-left: 6em; }
    .dig-form-photo li.ql-indent-2 { padding-left: 7.5em; counter-set: list-3 list-4 list-5 list-6 list-7 list-8; }
    .dig-form-photo li[data-list=ordered].ql-indent-2 { counter-increment: list-2; }
    .dig-form-photo li[data-list=ordered].ql-indent-2 > .ql-ui::before { content: counter(list-2, lower-roman) '. '; }
    .dig-form-photo .ql-indent-3 { padding-left: 9em; }
    .dig-form-photo li.ql-indent-3 { padding-left: 10.5em; counter-set: list-4 list-5 list-6 list-7 list-8; }
    .dig-form-photo li[data-list=ordered].ql-indent-3 { counter-increment: list-3; }
    .dig-form-photo li[data-list=ordered].ql-indent-3 > .ql-ui::before { content: counter(list-3, decimal) '. '; }
    .dig-form-photo .ql-indent-4 { padding-left: 12em; }
    .dig-form-photo li.ql-indent-4 { padding-left: 13.5em; counter-set: list-5 list-6 list-7 list-8; }
    .dig-form-photo li[data-list=ordered].ql-indent-4 { counter-increment: list-4; }
    .dig-form-photo li[data-list=ordered].ql-indent-4 > .ql-ui::before { content: counter(list-4, lower-alpha) '. '; }
    .dig-form-photo .ql-indent-5 { padding-left: 15em; }
    .dig-form-photo li.ql-indent-5 { padding-left: 16.5em; counter-set: list-6 list-7 list-8; }
    .dig-form-photo li[data-list=ordered].ql-indent-5 { counter-increment: list-5; }
    .dig-form-photo li[data-list=ordered].ql-indent-5 > .ql-ui::before { content: counter(list-5, lower-roman) '. '; }
    .dig-form-photo .ql-indent-6 { padding-left: 18em; }
    .dig-form-photo li.ql-indent-6 { padding-left: 19.5em; counter-set: list-7 list-8; }
    .dig-form-photo li[data-list=ordered].ql-indent-6 { counter-increment: list-6; }
    .dig-form-photo li[data-list=ordered].ql-indent-6 > .ql-ui::before { content: counter(list-6, decimal) '. '; }
    .dig-form-photo .ql-indent-7 { padding-left: 21em; }
    .dig-form-photo li.ql-indent-7 { padding-left: 22.5em; counter-set: list-8; }
    .dig-form-photo li[data-list=ordered].ql-indent-7 { counter-increment: list-7; }
    .dig-form-photo li[data-list=ordered].ql-indent-7 > .ql-ui::before { content: counter(list-7, lower-alpha) '. '; }
    .dig-form-photo .ql-indent-8 { padding-left: 24em; }
    .dig-form-photo li.ql-indent-8 { padding-left: 25.5em; }
    .dig-form-photo li[data-list=ordered].ql-indent-8 { counter-increment: list-8; }
    .dig-form-photo li[data-list=ordered].ql-indent-8 > .ql-ui::before { content: counter(list-8, lower-roman) '. '; }
    .dig-form-photo .ql-align-center { text-align: center; }
    .dig-form-photo .ql-align-right { text-align: right; }
    .dig-form-photo .ql-align-justify { text-align: justify; }
    /* 고정 이미지 칸 — 양식에 박힌 그림. 칸 폭에 맞추고 누르면 크게 본다 */
    .dig-form-ref-image { display: block; max-width: 100%; max-height: 240px; margin: 0 auto; cursor: zoom-in; }
    /* 이미지 칸 사진 보기 팝업 — 사진은 비율을 지켜 칸 안에 담고, 휠로 확대(assets/js/image_zoom.js) */
    .dig-form-image-view {

    /* 공통 알림창(common/common.js Alert) — 디지털 양식 화면에서만 한글을 단어 단위로 줄바꿈(글자 중간 끊김 방지, 공통 CSS는 그대로) */
    #commonAlertModalBody, #commonConfirmModalBody { word-break: keep-all; }
    /* 맨 위로 버튼 — 화면 스크롤 영역(.ifram-wrapper)이 내려가면 오른쪽 아래에 표시. 위치 고정은 표준 클래스에 없어 화면 CSS */

</style>
<!-- 맨 위로(TOP) 버튼 — 긴 양식에서 위로 이동 (피드백) -->
<button type="button" class="btn btn-band rounded-pill btn-icon dig-form-top" id="digFormTopBtn" title="맨 위로" data-labelCd="맨 위로" data-labelTarget="title"><i class="uil uil-arrow-up"></i></button>
<script type="text/javascript">
    // 섹션(dig_form_section) 순서대로: 점검항목 = 섹션의 칸(dig_form_item)을 RowIndex(행)·ColumnIndex(열) 순서로 <td rowspan colspan> 표 하나, 참고사진 = 에디터 HTML
    // 행 순번은 섹션마다 1부터 — 같은 행 판단(자동 판정·작업자)은 섹션 id + 행 순번(rowKey)
    // mode: 'view'(작성건 값 표시) · 'input'(입력 요소 + 같은 행 상·하한 숫자칸으로 OK/NG 자동 판정 — D12·D16) · 'setting'(입력칸 설정)
    // 판정 의미: 선택지(항목결과 코드)마다 Y 합격 / N 불합격 / X 해당없음 — 자동 판정·결과 표시는 선택지 코드가 아니라 의미로 본다
    const JUDGE_OK = 'Y', JUDGE_NG = 'N';
    const FORM_IMAGE_TYPES = ['image/png', 'image/jpeg', 'image/gif'];
    const SECTION_IMAGE_ROW = 0;   // 섹션 이미지 칸의 행 순번 (본문·머리줄은 1부터)
    const EXTRA_PREFIX = 'result.extra.';   // 머리글 입력 항목 bind (서버 dig_form.EXTRA_PREFIX)
    const EXTRA_MAX = 200;                  // 머리글 입력값 최대 글자 수 (서버 dig_form.HEADER_VALUE_MAX)
    // 머리글 목록 항목 bind(품목·품번·입고번호 — 서버 domain/services/dig_form_fields.py). 값은 HeaderValues 의 field.<키>,
    // 목록에서 고른 값의 코드는 field.<키>@code. 목록에 없는 값도 직접 써 넣는다(코드 없음)
    const FIELD_PREFIX = 'result.field.';
    const FIELD_CODE_SUFFIX = '@code';

    class DigFormRenderer {
        constructor() {
            this.url = '/api/dig_form/dig_form';
            this.form = null;
            this.sections = [];
            this.sectionById = {};
            this.cells = [];
            this.cellById = {};
            this.codes = {};
            this.mode = 'view';
        }

        loadDetail(formId, fnDone) {
            let _this = this;
            if (!formId) return;
            AjaxUtil.getAsyncData(_this.url, { action: 'detail', form_id: formId }, function (detail) {
                _this.form = detail.form;
                _this.sections = detail.sections || [];
                _this.sectionById = {};
                _this.sections.forEach(function (s) { _this.sectionById[s.id] = s; });
                _this.cells = detail.cells || [];
                _this.codes = detail.codes || {};
                _this.cellById = {};
                _this.cells.forEach(function (c) { _this.cellById[c.id] = c; });
                fnDone();
            });
        }

        // 상단 영역: 문서헤더.상단고정내용(JSON 칸 목록)을 표로 — bind 값은 form.*(문서헤더)·result.*(문서헤더결과)·appr.N(결재, 미연동)
        // $target: 그릴 표 (생략 시 #digFormTopTable) — 검사양식의 양식 편집기 머리글 미리보기, 머리글 섹션에서 지정
        // topCells: 그릴 칸 목록 (생략 시 맨 위 머리글 form.top_cells) — 머리글 섹션은 섹션의 cells
        // 작성일은 입력받지 않는다 — 작성건의 작성일, 새 작성(입력 상태)이면 오늘을 보인다(서버가 저장할 때 넣는 날)
        // 작성자도 입력받지 않는다 — 작성건을 마지막으로 저장한 사람, 입력 상태면 지금 사용자(저장하면 그 사람이 된다)
        renderTop(resultHeader, $target, topCells) {
            let _this = this;
            let f = this.form;
            let cells = topCells || f.top_cells || [];
            let formValues = {
                'form.Title': f.title, 'form.Code': f.code, 'form.Version': f.version,
                'form.EstablishDate': f.establish_date, 'form.ApplyModel': f.apply_model,
            };
            let resultValues = {
                'result.WriteDate': resultHeader ? resultHeader.write_date : (this.mode === 'input' ? this.today() : ''),
                'result.WorkOrderNumber': resultHeader ? resultHeader.work_order_number : '',
                'result.Writer': this.mode === 'input' ? (typeof userinfo !== 'undefined' ? userinfo.username : '')
                    : (resultHeader ? resultHeader.writer_name || '' : ''),
            };
            let inputIds = { 'result.WorkOrderNumber': 'work_order_number' };
            // 머리글 입력 항목(양식 편집기에서 라벨에 연결한 칸, bind = result.extra.<키>) — 값은 작성건 HeaderValues
            let headerValues = (resultHeader && resultHeader.header_values) || {};
            let labels = {};
            cells.forEach(function (c) { if (c.input_key) labels[c.input_key] = c.content; });

            let rows = {};
            cells.forEach(function (c) {
                (rows[c.row] = rows[c.row] || []).push(c);
            });
            let $table = ($target || $('#digFormTopTable')).empty().toggle(cells.length > 0);
            // 상단 표 열 너비 고정 (빈 결재칸이 좁아지지 않게) — 열 수 = 칸 좌표의 최대 끝 열
            // 칸에 "width"(%)가 있으면 그 열에 적용(병합 없는 칸만), 나머지 열은 남은 폭을 균등 분배
            let colCount = cells.reduce(function (m, c) { return Math.max(m, c.col + (c.colspan || 1) - 1); }, 0);
            if (colCount) {
                let widths = {};
                cells.forEach(function (c) { if (c.width && (c.colspan || 1) === 1) widths[c.col] = c.width; });
                let fixedSum = Object.keys(widths).reduce(function (s, k) { return s + widths[k]; }, 0);
                let rest = (100 - fixedSum) / Math.max(colCount - Object.keys(widths).length, 1);
                $table.addClass('dig-form-fixed');
                let $cg = $('<colgroup>');
                for (let i = 1; i <= colCount; i++) $cg.append($('<col>').css('width', (widths[i] || rest) + '%'));
                $table.append($cg);
            }
            // 칸에 "height"(px)가 있으면 그 행 높이로 적용 — 행에서 시작하는 세로 병합 없는 칸 중 가장 큰 값 (양식 편집이 행의 칸 모두에 같은 값을 둔다)
            let rowHeights = {};
            cells.forEach(function (c) {
                if (c.height && (c.rowspan || 1) === 1) rowHeights[c.row] = Math.max(rowHeights[c.row] || 0, c.height);
            });
            Object.keys(rows).map(Number).sort(function (a, b) { return a - b; }).forEach(function (r) {
                let $tr = $('<tr>');
                if (rowHeights[r]) $tr.css('height', rowHeights[r] + 'px');
                rows[r].sort(function (a, b) { return a.col - b.col; }).forEach(function (c) {
                    // 그리드 모양: 라벨 칸 = 그리드 머리줄 스타일(th.dig-form-head), 값 칸 = 일반 셀
                    let $td = c.content ? $('<th class="dig-form-head">') : $('<td class="text-center">');
                    $td.attr({ 'data-row': c.row, 'data-col': c.col });
                    if (c.rowspan > 1) $td.attr('rowspan', c.rowspan);
                    if (c.colspan > 1) $td.attr('colspan', c.colspan);
                    if (c.style === 'title') $td.addClass('fs-5 fw-bold text-center');
                    if (c.content) $td.text(c.content);
                    if (c.bind) {
                        if (_this.mode === 'input' && c.input && inputIds[c.bind]) {
                            // 상단 입력칸: 칸 위아래 여백·입력칸 바깥 여백 제거 — 행 높이가 커져 결재칸(행 병합)이 과하게 높아지지 않게(피드백 F4)
                            // 이어쓰기: 불러온 작성건의 작성일·WO를 채움
                            // 입력칸은 테두리 없이 칸을 채운다(dig-form-fill) — 칸 안에 상자가 겹치지 않게
                            $td.addClass('dig-form-fill').append($('<input class="form-control">').attr('type', 'text').attr('id', inputIds[c.bind]).attr('maxlength', 50).val(resultValues[c.bind] || ''));
                        } else if (c.bind.indexOf(EXTRA_PREFIX) === 0) {
                            let key = c.bind.substring(EXTRA_PREFIX.length);
                            let value = headerValues[key] || '';
                            let label = labels[key] || c.name;
                            let isLong = _this.isLongLabel(label, c.colspan);
                            if (isLong) $td.removeClass('text-center').addClass('text-start');
                            if (_this.mode === 'input' && c.input) {
                                let $in;
                                if (isLong) {
                                    // 긴 내용(Note·비고 등) — 여러 줄, 내용만큼 높이가 늘어난다(autoGrow)
                                    $in = $('<textarea class="form-control dig-form-extra" rows="1">');
                                } else {
                                    // 라벨이 날짜 이름(…일·일자·날짜)이면 날짜 선택. 날짜 형식이 아닌 값이 이미 있으면 지워지지 않게 글자로 둔다
                                    let isDate = _this.isDateLabel(label) && (!value || /^\d{4}-\d{2}-\d{2}$/.test(value));
                                    $in = $('<input class="form-control dig-form-extra">').attr('type', isDate ? 'date' : 'text');
                                }
                                $td.addClass('dig-form-fill').append($in.attr('maxlength', EXTRA_MAX)
                                    .attr('data-extra-key', key).attr('data-original', value).val(value));
                            } else {
                                $td.text(value);
                            }
                        } else if (c.bind.indexOf(FIELD_PREFIX) === 0) {
                            let key = 'field.' + c.bind.substring(FIELD_PREFIX.length);
                            let value = headerValues[key] || '';
                            if (_this.mode === 'input' && c.input) {
                                $td.addClass('dig-form-fill').append(_this.makeLookup(c.bind, key, value, headerValues[key + FIELD_CODE_SUFFIX] || ''));
                            } else {
                                $td.text(value);
                            }
                        } else if (c.bind.indexOf('appr.') === 0) {
                            // 결재 서명란 — 결재 연동 시 표준 컴포넌트(common/approve_box.html, ApproveBoxUtil) 사용 예정
                        } else if (c.bind === 'form.Title' && c.text) {
                            // 양식명 칸에 따로 적은 표시 글자 — 없으면 양식명
                            $td.text(c.text);
                        } else {
                            let v = c.bind.indexOf('result.') === 0 ? resultValues[c.bind] : formValues[c.bind];
                            $td.text(v != null ? v : '');
                        }
                    }
                    $tr.append($td);
                });
                $table.append($tr);
            });
            $table.find('textarea.dig-form-extra').each(function () { _this.autoGrow(this); });
            $table.off('input.digFormGrow').on('input.digFormGrow', 'textarea.dig-form-extra', function () { _this.autoGrow(this); });
            $table.find('select.dig-form-lookup').each(function () { _this.initLookup($(this)); });
        }

        // 머리글 목록 항목 입력 — 값은 칸에 보일 글자, data-code 는 목록에서 고른 코드(직접 쓴 값이면 빈 값)
        makeLookup(bind, key, value, code) {
            let $sel = $('<select class="form-select dig-form-lookup">').attr({
                'data-bind': bind, 'data-field-key': key, 'data-original': value, 'data-code': code, 'data-code-original': code,
            }).append($('<option>').val('').text(''));
            if (value) $sel.append($('<option>').val(value).text(value));
            return $sel.val(value);
        }

        // 검색해서 고르는 선택 상자(Select2) — 입력하면 서버에서 찾고(header_lookup), 목록에 없는 값은 Enter 로 그대로 넣는다(tags)
        // 고른 항목에 함께 채울 값(품목 ↔ 품번)이 있으면 같은 작성 화면의 그 칸도 채운다
        initLookup($sel) {
            let _this = this;
            let bind = $sel.attr('data-bind');
            let $modal = $sel.closest('.modal');
            $sel.select2({
                width: '100%',
                tags: true,
                allowClear: true,
                placeholder: '',
                dropdownParent: $modal.length ? $modal : $(document.body),   // 모달이 포커스를 가져가 검색칸에 입력되지 않으므로 모달 안에 붙인다
                language: {
                    noResults: function () { return '검색 결과가 없습니다. 입력한 글자를 그대로 쓰려면 Enter 를 누릅니다.'; },
                    searching: function () { return '찾는 중입니다.'; },
                },
                createTag: function (params) {
                    let term = $.trim(params.term || '').slice(0, EXTRA_MAX);
                    return term ? { id: term, text: term + ' (직접 입력)', manual: true } : null;
                },
                templateSelection: function (d) { return d.id || ''; },
                ajax: {
                    delay: 250,
                    transport: function (params, success, failure) {
                        AjaxUtil.getAsyncData(_this.url, { action: 'header_lookup', bind: bind, q: (params.data && params.data.term) || '' }, success, failure);
                        return { abort: function () { } };
                    },
                    processResults: function (rows) {
                        return {
                            results: (Array.isArray(rows) ? rows : []).map(function (r) {
                                return { id: r.text, text: r.label, code: r.code, values: r.values };
                            }),
                        };
                    },
                },
            });
            $sel.on('select2:select', function (e) {
                let d = e.params.data || {};
                $sel.attr('data-code', d.manual ? '' : (d.code || ''));
                Object.keys(d.values || {}).forEach(function (other) {
                    if (other !== bind) _this.setLookup(other, d.values[other], d.code || '');
                });
            });
            $sel.on('select2:clear', function () { $sel.attr('data-code', ''); });
        }

        // 다른 목록 항목 칸에 값을 넣는다(그 칸이 이 작성 화면에 있을 때만)
        setLookup(bind, value, code) {
            let $other = $('#digFormTopTable, #digFormTable').find('select.dig-form-lookup').filter(function () { return $(this).attr('data-bind') === bind; });
            if (!$other.length) return;
            if (!$other.find('option').filter(function () { return this.value === value; }).length) $other.append($('<option>').val(value).text(value));
            $other.val(value).trigger('change');
            $other.attr('data-code', code);
        }

        // 오늘 (YYYY-MM-DD, 브라우저 날짜)
        today() {
            let d = new Date();
            let pad = function (n) { return (n < 10 ? '0' : '') + n; };
            return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
        }

        // 여러 줄 입력칸 높이를 내용에 맞춘다
        autoGrow(el) {
            el.style.height = 'auto';
            el.style.height = el.scrollHeight + 'px';
        }

        // 머리글 입력 항목의 여러 줄 입력 여부 — 라벨 이름(Note·비고·특이·확인 사항·메모)이나 넓은 칸(6열 이상 병합)으로 정한다
        isLongLabel(label, colspan) {
            return /note|비고|특이|확인\s*사항|메모/i.test($.trim(label || '')) || (colspan || 1) >= 6;
        }

        // 머리글 입력 항목의 날짜 선택 여부 — 칸 설정을 늘리지 않고 라벨 이름으로 정한다(예: 중간검사일·검사일자·입고날짜. 요일은 아니다)
        isDateLabel(label) {
            let s = $.trim(label || '');
            return (/일$/.test(s) && !/요일$/.test(s)) || /일자|날짜/.test(s);
        }

        // 머리글 입력 항목 중 바뀐 것만 {키: 값} — 비운 값도 보낸다(서버가 지운다). 맨 위 머리글과 머리글 섹션 모두
        collectHeaderValues() {
            let values = {};
            $('#digFormTopTable, #digFormTable').find('.dig-form-extra').each(function () {
                let $el = $(this);
                let v = $.trim($el.val());
                if (v !== ($el.attr('data-original') || '')) values[$el.attr('data-extra-key')] = v;
            });
            // 목록 항목 — 글자와 목록에서 고른 코드를 따로 보낸다(직접 쓴 값은 코드를 비운다)
            $('#digFormTopTable, #digFormTable').find('select.dig-form-lookup').each(function () {
                let $el = $(this);
                let key = $el.attr('data-field-key');
                let v = $.trim($el.val() || '');
                let code = v ? ($el.attr('data-code') || '') : '';
                if (v !== ($el.attr('data-original') || '')) values[key] = v;
                if (code !== ($el.attr('data-code-original') || '')) values[key + FIELD_CODE_SUFFIX] = code;
            });
            return values;
        }

        // 섹션 머리줄 행 수 (섹션마스터 HeaderRowCount — 2단 머리줄 등, D24)
        headerRows(sectionId) {
            let s = this.sectionById[sectionId];
            return (s && s.header_row_count) || 1;
        }

        // 같은 행 식별 — 섹션 id + 섹션 안 행 순번
        rowKey(sectionId, rowIndex) {
            return sectionId + '-' + rowIndex;
        }

        // 입력칸 설정 대상: 본문 칸 중 입력칸이거나 글자 없는 칸 (머리줄·글자 칸 제외)
        isSettable(c) {
            return c.row_index > this.headerRows(c.section_id) && (c.input_yn === 'Y' || !c.content);
        }

        // 입력칸 설정에서 칸에 보이는 입력 방식 — 판정은 선택지 그룹 이름(judgeGroupNames 는 양식 편집이 채운다)
        settingLabel(c) {
            if (c.result_type === 'S') return (this.judgeGroupNames || {})[c.code_group] || '판정';
            if (c.result_type === 'T') return '문자';
            if (c.result_type === 'I') return '이미지';
            let lt = this.limitText(c);
            return '숫자' + (lt ? ' ' + lt : '');
        }

        limitText(c) {
            if (c.lower_limit == null && c.upper_limit == null) return '';
            return (c.lower_limit != null ? Number(c.lower_limit) : '') + ' ~ ' + (c.upper_limit != null ? Number(c.upper_limit) : '');
        }

        // 판정 칸(선택지 3개 이하 코드그룹 — OK/NG, 합격/불합격/N/A 등): 라디오 버튼 (SF_MES 샘플 마크업 form-check form-check-inline — samples/03.sample_list2.html)
        makeJudgeRadio(c) {
            // 좌우 배치, 칸이 좁으면(1024 폭) 다음 줄로 — 선택지 하나는 끊지 않는다 · data-meaning: 선택지의 판정 의미(자동 판정에 쓴다)
            let $box = $('<div class="dig-form-radio d-flex flex-wrap justify-content-center align-items-center column-gap-2">').attr('data-group', c.code_group);
            (this.codes[c.code_group] || []).forEach(function (o) {
                let rid = 'judge_' + c.id + '_' + o.code;
                // 라디오 표준: 원 + 오른쪽 라벨(SF UI Style Guide p20, 피드백 F5)
                $box.append($('<div class="form-check form-check-inline mb-0 me-0 text-nowrap">')
                    .append($('<input type="radio" class="form-check-input">').attr('id', rid).attr('name', 'judge_' + c.id).attr('data-meaning', o.meaning || '').val(o.code))
                    .append($('<label class="form-check-label">').attr('for', rid).text(o.value)));
            });
            return $box;
        }

        // 이어쓰기: 저장된 값을 입력 요소에 채움 — 판정 라디오는 작업자가 고른 값으로 보고 자동 판정이 덮어쓰지 않음(data-manual)
        fillInput($el, c, v) {
            let value = '';
            if (c.result_type === 'S') value = v.combo_result || '';
            else if (c.result_type === 'N') value = v.number_result != null ? String(Number(v.number_result)) : '';
            else if (c.result_type === 'B') value = v.check_result_yn || '';
            else value = v.text_result || '';
            if (value === '') return;
            if ($el.hasClass('dig-form-image')) {
                this.setImage($el, value);
            } else if ($el.hasClass('dig-form-radio')) {
                this.setJudge($el, value);
                $el.attr('data-manual', 'Y');
            } else if ($el.is(':checkbox')) {
                $el.prop('checked', value === 'Y');
            } else {
                $el.val(value);
            }
            $el.attr('data-loaded', 'Y');
        }

        setJudge($box, value) {
            $box.find('input[type=radio]').prop('checked', false);
            if (value) $box.find('input[type=radio][value="' + value + '"]').prop('checked', true);
        }

        getValue($el) {
            if ($el.hasClass('dig-form-image')) return $el.find('.dig-form-image-value').val();
            if ($el.hasClass('dig-form-radio')) return $el.find('input[type=radio]:checked').val() || '';
            if ($el.is(':checkbox')) return $el.is(':checked') ? 'Y' : '';
            return $el.val();
        }

        // 이미지 칸(ResultType='I') — 행마다 사진 1장. 값 = 첨부 id(서버 domain/services/dig_form_image.py), 칸에는 아이콘만 두고 누르면 팝업으로 본다
        // 비전검사항목이 연결된 칸(cell.vision_item)은 값이 비전 데이터 이미지 id 라 /media/dig-form-asset/ 로 본다
        imageUrl(fileId, cell) {
            if (!/^\d+$/.test(String(fileId || ''))) return '';
            return (cell && cell.vision_item ? '/media/dig-form-asset/' : '/media/dig-form-image/') + fileId + '/';
        }

        makeImageShowButton() {
            return $('<button type="button" class="btn btn-sm btn-outline-light dig-form-image-show" title="사진 보기" data-labelCd="사진 보기" data-labelTarget="title"><i class="uil uil-image"></i></button>');
        }

        // 거치대 비전검사항목 칸은 [거치대 결과 불러오기]도 둔다. 치수 측정은 그것만(측정값은 거치대 클라이언트만 낸다, 설계 2026-10-21 §7)
        makeImageInput(cell) {
            let v = cell && cell.vision_item;
            let rig = !!(v && v.capture_method === 'RIG');
            let measurement = !!(v && v.task_type === 'MEASUREMENT');
            return $('<div class="dig-form-image d-inline-flex align-items-center gap-1">').append(
                $('<input type="hidden" class="dig-form-image-value">').val(''),
                $('<input type="file" class="d-none dig-form-image-file">').attr('accept', FORM_IMAGE_TYPES.join(',')),
                measurement ? null : $('<button type="button" class="btn btn-sm btn-outline-light dig-form-image-upload" title="사진 올리기" data-labelCd="사진 올리기" data-labelTarget="title"><i class="uil uil-upload"></i></button>'),
                rig ? $('<button type="button" class="btn btn-sm btn-outline-light dig-form-rig-result" title="거치대 결과 불러오기" data-labelCd="거치대 결과 불러오기" data-labelTarget="title"><i class="uil uil-history"></i></button>') : null,
                this.makeImageShowButton().addClass('d-none'),
                $('<button type="button" class="btn btn-sm btn-outline-light dig-form-image-remove d-none" title="사진 빼기" data-labelCd="사진 빼기" data-labelTarget="title"><i class="uil uil-times"></i></button>'));
        }

        // 칸 값 이미지가 거치대 검사에서 왔으면 그 판정(치수 측정은 측정점마다 한 줄) — 보기·결과 화면
        makeVisionResult(result) {
            let $box = $('<div class="small dig-form-vision-result">').append($('<div>').text('거치대 판정: ' + result.judgement));
            (result.measured || []).forEach(function (m) {
                $box.append($('<div>').toggleClass('text-danger', !m.ok).text(m.label + ' ' + m.text));
            });
            return $box;
        }

        // 사진이 있으면 보기·빼기 아이콘을 보이고, 올리기 아이콘은 "다시 올리기"가 된다
        setImage($box, fileId) {
            let has = !!this.imageUrl(fileId);
            $box.find('.dig-form-image-value').val(has ? String(fileId) : '');
            $box.find('.dig-form-image-show, .dig-form-image-remove').toggleClass('d-none', !has);
            $box.find('.dig-form-image-upload').attr('title', has ? '사진 다시 올리기' : '사진 올리기');
        }

        // 고르는 즉시 올린다 — 서버는 연결 전 첨부(DataPk=0)로 두고 [저장] 때 칸 결과에 연결한다
        // 원본 크기 그대로 올린다 — AI 분석에 쓰므로 줄이지 않는다(서버 한도 30MB)
        uploadImage($box, file) {
            let _this = this;
            if (!file) return;
            if (FORM_IMAGE_TYPES.indexOf(file.type) < 0) {
                Alert.alert('', 'PNG·JPG·GIF 이미지만 올릴 수 있습니다.');
                return;
            }
            let fd = new FormData();
            fd.append('uploadfile', file);
            let $buttons = $box.find('button').prop('disabled', true);
            AjaxUtil.postFileAsyncData(_this.url + '?action=upload_image', fd, function (res) {
                $buttons.prop('disabled', false);
                if (!res || !res.success) {
                    Alert.alert('', (res && res.message) || '사진을 올리지 못했습니다. 다시 올려 주세요.');
                    return;
                }
                _this.setImage($box, res.fileId);
                $box.find('.dig-form-image-value').trigger('change');
            }, function (req, status, error) {
                $buttons.prop('disabled', false);
                AjaxUtil.failureCallback(req, status, error);
            });
        }

        showImage(url) {
            if (!url) return;
            let $img = $('<img alt="">').attr('src', url);
            let $view = $('<div class="dig-form-image-view flex-grow-1">').append($img);
            let $content = $('<div class="content_wrap popup p-2 d-flex flex-column h-100">').append(
                $view,
                $('<div class="d-flex justify-content-end mt-2">').append(
                    $('<button type="button" class="btn btn-outline-light" id="modal-close-button">').append($('<span data-commonCd="닫기">').text('닫기'))));
            let docWidth = document.documentElement.clientWidth;
            new PopupDraggable('사진 보기').open({
                width: Math.min(1000, docWidth - 32),
                height: Math.min(760, $(window).height() - 64),
                $content,
            });
            if (window.ImageZoom) ImageZoom.attach($view[0], $img[0]);
        }

        // 섹션 이미지 — 섹션마다 사진 1장(나중에 AI 가 섹션 표 전체를 채움). 입력 모드는 올리기·보기·빼기, 보기 모드는 사진이 있을 때 보기만
        // 설정 모드(입력칸 설정)는 GRID 양식용이라 표시하지 않는다
        makeSectionImage(c, v) {
            let $wrap = $('<div class="d-flex align-items-center gap-1 text-nowrap">')
                .append($('<span class="small text-muted">').text('섹션 이미지'));
            if (this.mode === 'input') {
                let $in = this.makeInput(c);
                if (v) this.fillInput($in, c, v);
                return $wrap.append($in);
            }
            if (this.mode === 'view' && v && this.imageUrl(v.text_result, c)) {
                return $wrap.append(this.makeImageShowButton().attr('data-url', this.imageUrl(v.text_result, c)));
            }
            return null;
        }

        makeInput(c) {
            let $el;
            if (c.result_type === 'S' && (this.codes[c.code_group] || []).length <= 3) {
                $el = this.makeJudgeRadio(c).addClass('dig-form-input');
            } else if (c.result_type === 'S') {
                $el = $('<select class="form-select dig-form-input">').append($('<option>').val('').text(''));
                (this.codes[c.code_group] || []).forEach(function (o) {
                    $el.append($('<option>').val(o.code).text(o.value));
                });
            } else if (c.result_type === 'N') {
                // 허용 범위 placeholder 없음 — SPEC 칸에 이미 있고, 범위 안에서 쓰라는 지시처럼 보임(피드백 F12)
                // 결과값 정렬: 칸 유형과 무관하게 가운데 (2026-10-02 사용자 — 한 열에 숫자·문자 혼재, OQ-037)
                // 숫자칸: 글자 입력칸 + 숫자 키패드 힌트 — number 타입의 위아래 버튼이 좁은 칸(예: 4POINT P1~P4)에서 값을 가려서 사용 안 함
                // 숫자 형식은 저장 전 invalidNumbers()로 검사, 좌우 여백은 표준 유틸리티 px-1로 줄임
                $el = $('<input type="text" inputmode="decimal" autocomplete="off" class="form-control text-center px-1 dig-form-input dig-form-num">');
            } else if (c.result_type === 'B') {
                $el = $('<input type="checkbox" class="form-check-input dig-form-input">');
            } else if (c.result_type === 'I') {
                $el = this.makeImageInput(c).addClass('dig-form-input');
            } else {
                $el = $('<input type="text" class="form-control text-center dig-form-input">');
            }
            return $el.attr('data-item-id', c.id).attr('data-row', this.rowKey(c.section_id, c.row_index));
        }

        // values: 작성건 항목결과(result_values) · resultHeader: 작성건 헤더(작성일·WO)
        // 섹션마다 너비(12칸 기준)만큼 배치 — 좁은 화면은 한 줄에 하나
        render(values, resultHeader) {
            let _this = this;
            this.renderTop(resultHeader);

            let valueByItem = {};
            let workerByRow = {};
            (values || []).forEach(function (v) {
                valueByItem[v.item_id] = v;
                if (v.worker_name) workerByRow[_this.rowKey(v.section_id, v.row_index)] = v.worker_name;
            });
            let cellsBySection = {};
            this.cells.forEach(function (c) {
                (cellsBySection[c.section_id] = cellsBySection[c.section_id] || []).push(c);
            });

            let $row = $('<div class="row g-2">');
            $('#digFormTable').empty().append($row);
            // 이미지 칸 사진 보기 — 보기 모드는 버튼의 data-url, 입력 모드는 칸의 현재 값과 칸의 비전 연결로 주소를 만든다
            $('#digFormTable').off('click.digFormImage').on('click.digFormImage', '.dig-form-image-show', function () {
                let $box = $(this).closest('.dig-form-image');
                _this.showImage($box.length
                    ? _this.imageUrl($box.find('.dig-form-image-value').val(), _this.cellById[$box.attr('data-item-id')])
                    : $(this).attr('data-url'));
            });
            $('#digFormTable').off('click.digFormRef').on('click.digFormRef', '.dig-form-ref-image', function () {
                _this.showImage($(this).attr('src'));
            });
            this.sections.forEach(function (s) {
                if (s.section_type === 'HEADER') {
                    // 머리글 섹션 — 맨 위 머리글과 같은 표(renderTop). 입력값은 작성건 HeaderValues 하나에 모인다
                    if (!(s.cells || []).length) return;
                    let $col = $('<div class="col-12">').addClass(s.width && s.width < 12 ? 'col-xl-' + s.width : '');
                    if (s.title) $col.append($('<div class="fw-bold mb-1">').text(s.title));
                    let $table = $('<table class="dig-form-table">').attr('data-section', s.id);
                    // 화면에 붙인 뒤 그린다 — 목록 항목의 검색 상자(Select2)가 모달 안에 목록을 붙인다
                    $row.append($col.append($('<div class="table-responsive">').append($('<div class="dig-form-grid">').append($table))));
                    _this.renderTop(resultHeader, $table, s.cells);
                    return;
                }
                let isPhoto = s.section_type === 'PHOTO';
                // 섹션 이미지 칸(행 0, 서버 form_edit.SECTION_IMAGE_ROW) — 표에 그리지 않고 섹션 제목 오른쪽에 둔다
                let sectionImage = null;
                let cells = (cellsBySection[s.id] || []).filter(function (c) {
                    if (c.row_index !== SECTION_IMAGE_ROW) return true;
                    sectionImage = c;
                    return false;
                });
                if (isPhoto ? !s.content : !cells.length) return;
                let $col = $('<div class="col-12">').addClass(s.width && s.width < 12 ? 'col-xl-' + s.width : '');
                let $image = sectionImage ? _this.makeSectionImage(sectionImage, valueByItem[sectionImage.id]) : null;
                if (s.title || $image) {
                    $col.append($('<div class="d-flex justify-content-between align-items-end gap-2 mb-1">')
                        .append($('<div class="fw-bold">').text(s.title || ''), $image));
                }
                if (isPhoto) {
                    $col.append($('<div class="dig-form-grid dig-form-photo p-2">').html(_this.safeHtml(s.content)));
                } else {
                    let $table = $('<table class="dig-form-table">').attr('data-section', s.id);
                    _this.renderSection($table, s, cells, valueByItem, workerByRow);
                    $col.append($('<div class="table-responsive">').append($('<div class="dig-form-grid">').append($table)));
                }
                $row.append($col);
            });
        }

        // 점검항목 섹션 표 하나
        renderSection($table, section, cells, valueByItem, workerByRow) {
            let _this = this;
            let rows = {};
            cells.forEach(function (c) {
                (rows[c.row_index] = rows[c.row_index] || []).push(c);
            });

            let headerRows = this.headerRows(section.id);
            let showWorker = section.worker_column_yn !== 'N';
            let orders = Object.keys(rows).map(Number).sort(function (a, b) { return a - b; });
            // 열 너비: 머리줄(여러 행) 중 병합 안 된 칸의 최소컬럼넓이(px)를 원본 비율(%)로 colgroup에 적용
            // 표는 섹션 폭에 맞춰 늘고 줄며 가로 스크롤을 두지 않는다 — 좁으면 칸 안에서 줄바꿈(1024 폭 기준, 사용자 결정 2026-10-16)
            let widths = {};
            let colCount = 0;
            cells.forEach(function (c) {
                colCount = Math.max(colCount, c.column_index + (c.col_span || 1) - 1);
                if (c.row_index <= headerRows && (c.col_span || 1) === 1 && c.min_column_width) widths[c.column_index] = c.min_column_width;
            });
            // 병합된 머리줄 칸의 너비는 그 칸이 덮는 열 중 너비 없는 열에 똑같이 나눔 (예: "결과값" 4칸 병합)
            cells.forEach(function (c) {
                let span = c.col_span || 1;
                if (c.row_index > headerRows || span === 1 || !c.min_column_width) return;
                for (let i = c.column_index; i < c.column_index + span; i++) {
                    if (!widths[i]) widths[i] = c.min_column_width / span;
                }
            });
            let totalWidth = Object.keys(widths).reduce(function (s, k) { return s + widths[k]; }, 0);
            $table.addClass('dig-form-fixed');
            if (totalWidth) {
                let $cg = $('<colgroup>');
                for (let i = 1; i <= colCount; i++) $cg.append($('<col>').css('width', widths[i] ? (widths[i] * 100 / totalWidth) + '%' : ''));
                $table.append($cg);
            }
            orders.forEach(function (order) {
                let isHead = order <= headerRows;
                let $tr = $('<tr>');
                rows[order].forEach(function (c) {
                    // 그리드 모양: 머리줄 행 = 그리드 머리줄 스타일, 본문 글자 칸 = 일반 셀(왼쪽 정렬), 입력칸(입력컬럼여부=Y — 서버 검증과 같은 기준) = 가운데
                    let isInput = c.input_yn === 'Y';
                    let $td = isHead
                        ? $('<th class="dig-form-head">')
                        : (isInput ? $('<td>') : $('<td class="text-start">'));
                    if (c.row_span > 1) $td.attr('rowspan', c.row_span);
                    if (c.col_span > 1) $td.attr('colspan', c.col_span);
                    if (isInput) {
                        let lt = _this.limitText(c);
                        // 입력칸이 있는 칸은 좌우 여백을 줄여 입력값이 보일 공간 확보(좁은 칸 — 4POINT 등)
                        $td.addClass('text-center px-1').attr('title', 'id ' + c.id + ' · ' + c.result_type + (lt ? ' · 허용 ' + lt : ''));
                        if (_this.mode === 'setting') {
                            $td.text(_this.settingLabel(c));
                        } else if (_this.mode === 'input') {
                            let $in = _this.makeInput(c);
                            $td.append($in);
                            if (valueByItem[c.id]) _this.fillInput($in, c, valueByItem[c.id]);
                        } else {
                            let v = valueByItem[c.id];
                            let text = '';
                            if (v) {
                                if (c.result_type === 'S') text = v.combo_value || v.combo_result || '';
                                else if (c.result_type === 'N') text = v.number_result != null ? Number(v.number_result) : '';
                                else if (c.result_type === 'B') text = v.check_result_yn || '';
                                else text = v.text_result || '';
                            }
                            // 판정값 표시: SF_MES 일지 관례 result-chip — 판정 의미 Y(합격)=ok, N(불합격)=ng, X(해당없음)=off
                            let chip = { Y: 'ok', N: 'ng', X: 'off' }[v ? v.combo_meaning : ''];
                            if (c.result_type === 'I') {
                                if (_this.imageUrl(text, c)) $td.append(_this.makeImageShowButton().attr('data-url', _this.imageUrl(text, c)));
                                if (v && v.vision_result) $td.append(_this.makeVisionResult(v.vision_result));
                            } else if (c.result_type === 'S' && chip) {
                                $td.append($('<span class="result-chip">').addClass(chip).text(text));
                            } else {
                                $td.text(text);
                            }
                        }
                        // 앞뒤 글자 — {} 가 있으면 그 자리에 입력칸(값)을 넣어 한 줄로, 없으면 입력칸 아래에 작게(칸 단위 양식의 설명 글자)
                        let at = c.content ? c.content.indexOf('{}') : -1;
                        if (at >= 0) {
                            let $line = $('<div class="dig-form-inline">');
                            if (at > 0) $line.append($('<span>').text(c.content.slice(0, at)));
                            $line.append($('<span class="dig-form-slot">').append($td.contents().detach()));
                            if (c.content.length > at + 2) $line.append($('<span>').text(c.content.slice(at + 2)));
                            $td.append($line);
                        } else if (c.content) {
                            $td.append($('<div class="small text-muted">').text(c.content));
                        }
                        // 비전검사항목이 연결된 이미지 칸 — 어느 항목의 데이터로 들어가는지 보인다(검사양식 상세·검사작성·검사결과)
                        if (c.vision_item) $td.append($('<div class="small text-muted">').text('비전: ' + c.vision_item.code));
                    } else if (isHead) {
                        $td.text(c.content || '');
                    } else if (c.result_type === 'R') {
                        // 고정 이미지 칸(서버 form_edit REF_IMAGE) — Content = 그림 첨부 id. 위 칸과 병합한 행은 rowspan 으로 덮인다
                        let url = _this.imageUrl(c.content);
                        $td.addClass('text-center');
                        if (url) $td.append($('<img class="dig-form-ref-image" alt="">').attr('src', url));
                    } else {
                        // 끝에 남은 공백·줄바꿈은 빈 줄로 보이지 않게 자른다
                        $td.addClass('dig-form-text').text((c.content || '').replace(/\s+$/, ''));
                    }
                    // 설정 모드: 바꿀 수 있는 칸 표시(입력칸 = table-info), 클릭으로 선택
                    if (_this.mode === 'setting' && _this.isSettable(c)) {
                        $td.addClass('dig-form-setcell').attr('data-item-id', c.id).css('cursor', 'pointer');
                        if (isInput) $td.addClass('table-info');
                    }
                    $tr.append($td);
                });
                // 작업자 열(섹션 작업자표시여부=Y): 머리줄은 헤더 칸, 본문 행은 결과의 작업자 자동 표시 (D11b·D24)
                if (!isHead && showWorker) $tr.append($('<td class="text-center">').text(workerByRow[_this.rowKey(section.id, order)] || ''));
                $table.append($tr);
            });
        }

        // 참고사진 본문(에디터 HTML) — 스크립트·이벤트 속성·javascript: 주소 제거 후 표시
        safeHtml(html) {
            let doc = new DOMParser().parseFromString(html || '', 'text/html');
            doc.querySelectorAll('script, style, iframe, object, embed, link, meta, form').forEach(function (el) { el.remove(); });
            doc.querySelectorAll('*').forEach(function (el) {
                Array.from(el.attributes).forEach(function (a) {
                    let name = a.name.toLowerCase();
                    let value = (a.value || '').replace(/\s/g, '').toLowerCase();
                    if (name.indexOf('on') === 0 || ((name === 'href' || name === 'src') && value.indexOf('javascript:') === 0)) el.removeAttribute(a.name);
                });
            });
            return doc.body.innerHTML;
        }

        // 같은 행(섹션 id + 행 순번)의 상·하한 있는 숫자칸 평가 → 'Y'(OK) / 'N'(NG) / null(판정 불가) — 경계 포함(D13)
        judgeRow(rowOrder) {
            let _this = this;
            let result = null;
            $('#digFormTable .dig-form-num[data-row="' + rowOrder + '"]').each(function () {
                let c = _this.cellById[$(this).attr('data-item-id')];
                if (!c || (c.lower_limit == null && c.upper_limit == null)) return;
                let raw = $(this).val();
                if (raw === '' || isNaN(Number(raw))) return;
                let n = Number(raw);
                let ok = (c.lower_limit == null || n >= Number(c.lower_limit)) && (c.upper_limit == null || n <= Number(c.upper_limit));
                if (!ok) result = JUDGE_NG;
                else if (result === null) result = JUDGE_OK;
            });
            return result;
        }

        // 자동 판정 대상 = 같은 행의 판정 라디오 중 합격(Y)·불합격(N) 의미 선택지가 모두 있는 것
        judgeSelects(rowOrder) {
            return $('#digFormTable .dig-form-radio[data-row="' + rowOrder + '"]').filter(function () {
                return $(this).find('input[data-meaning="' + JUDGE_OK + '"]').length && $(this).find('input[data-meaning="' + JUDGE_NG + '"]').length;
            });
        }

        // 의미로 선택 — 같은 의미가 여러 개면 첫 선택지(예: 양호·보통 = 합격 → 양호)
        setJudgeByMeaning($box, meaning) {
            $box.find('input[type=radio]').prop('checked', false);
            $box.find('input[type=radio][data-meaning="' + meaning + '"]').first().prop('checked', true);
        }

        // 숫자 입력 → 판정칸 미리 채움(작업자가 직접 고른 칸은 유지) 후 불일치 표시
        onNumberChange(rowOrder) {
            let _this = this;
            let computed = _this.judgeRow(rowOrder);
            _this.judgeSelects(rowOrder).each(function () {
                if (computed !== null && $(this).attr('data-manual') !== 'Y') _this.setJudgeByMeaning($(this), computed);
                _this.markMismatch($(this), computed);
            });
        }

        onJudgeChange($sel) {
            $sel.attr('data-manual', 'Y');
            this.markMismatch($sel, this.judgeRow($sel.attr('data-row')));
        }

        markMismatch($sel, computed) {
            let $td = $sel.closest('td');
            $td.find('.dig-form-warn').remove();
            $td.removeClass('table-warning');
            // 고른 선택지의 의미와 계산값 비교 — 해당없음(X) 등 다른 의미는 경고하지 않는다
            let meaning = $sel.find('input[type=radio]:checked').attr('data-meaning') || '';
            if (computed !== null && (meaning === JUDGE_OK || meaning === JUDGE_NG) && meaning !== computed) {
                let label = $sel.find('input[data-meaning="' + computed + '"]').first().next('label').text();
                $td.addClass('table-warning');
                $td.append($('<div class="small text-danger dig-form-warn">').text('⚠ 계산값 ' + label));
            }
        }

        // 입력 모드 이벤트(숫자 → 판정 미리 채움, 판정 직접 선택 → 불일치 표시)
        bindInputEvents() {
            let _this = this;
            $('#digFormTable').on('input', '.dig-form-num', function (e) {
                _this.onNumberChange($(this).attr('data-row'));
            });
            $('#digFormTable').on('change', '.dig-form-radio input[type=radio]', function (e) {
                _this.onJudgeChange($(this).closest('.dig-form-radio'));
            });
            // 이미지 칸 — 비전검사항목이 연결된 칸은 사진 넣기 팝업(dig_form_capture.html), 아니면 숨은 파일 선택. 빼기는 값만 비운다(저장 때 서버가 정리)
            $('#digFormTable').on('click', '.dig-form-image-upload', function (e) {
                let $box = $(this).closest('.dig-form-image');
                let cell = _this.cellById[$box.attr('data-item-id')];
                if (cell && cell.vision_item) {
                    new DigFormCapture(cell, function (assetId) {
                        _this.setImage($box, assetId);
                        $box.find('.dig-form-image-value').trigger('change');
                    }).open();
                    return;
                }
                $box.find('.dig-form-image-file').trigger('click');
            });
            $('#digFormTable').on('click', '.dig-form-rig-result', function (e) {
                let $box = $(this).closest('.dig-form-image');
                let cell = _this.cellById[$box.attr('data-item-id')];
                new DigFormRigResult(cell, function (assetId) {
                    _this.setImage($box, assetId);
                    $box.find('.dig-form-image-value').trigger('change');
                }).open();
            });
            $('#digFormTable').on('change', '.dig-form-image-file', function (e) {
                let file = this.files && this.files[0];
                this.value = '';   // 같은 파일을 다시 골라도 change 가 나게
                _this.uploadImage($(this).closest('.dig-form-image'), file);
            });
            $('#digFormTable').on('click', '.dig-form-image-remove', function (e) {
                let $box = $(this).closest('.dig-form-image');
                _this.setImage($box, '');
                $box.find('.dig-form-image-value').trigger('change');
            });
        }

        // 입력값 수집 — 빈 칸 제외 · [{item_id, value}] (작업자 = 저장한 로그인 사용자)
        collectValues() {
            let _this = this;
            let items = [];
            $('#digFormTable .dig-form-input').each(function () {
                let $el = $(this);
                let v = _this.getValue($el);
                // 불러온 칸(data-loaded)은 비워도 보냄 — 서버가 값을 지움
                if ((v !== '' && v != null) || $el.attr('data-loaded') === 'Y') items.push({ item_id: $el.attr('data-item-id'), value: v == null ? '' : String(v) });
            });
            return items;
        }

        // 숫자칸에 숫자가 아닌 값 — Bootstrap is-invalid 표시 후 개수 반환
        invalidNumbers() {
            let count = 0;
            $('#digFormTable .dig-form-num').each(function () {
                let v = $.trim($(this).val());
                let bad = v !== '' && !/^-?\d+(\.\d+)?$/.test(v);
                $(this).toggleClass('is-invalid', bad);
                if (bad) count++;
            });
            return count;
        }

        mismatchCount() {
            return $('#digFormTable .dig-form-warn').length;
        }
    }
    // 맨 위로 버튼: 화면은 .ifram-wrapper 안에서 스크롤됨(layout_page.html)
    $(function () {
        let $scroller = $('.ifram-wrapper');
        let $top = $('#digFormTopBtn');
        $scroller.on('scroll', function () { $top.toggle(this.scrollTop > 300); });
        $top.on('click', function () { $scroller.animate({ scrollTop: 0 }, 200); });
    });
</script>
