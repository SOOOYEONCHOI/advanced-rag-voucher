<!-- 자재입고 검색 팝업 — 수입검사 작성(form_type=INCOMING)이 include 로 쓴다
     사용: new DigFormMatInSearchPopup().show(키워드, function (item) { item.receipt_number … })
     입고(mst_receipt, ERP 구매요청 = 입고의뢰) 중 검사 대상을 입고일·입고번호/품목으로 찾는다. 입고번호는 작성건 WorkOrderNumber 에 들어간다
     (DECISIONS 사용자 결정 2026-10-19). API 는 입고 내역의 /api/definition/receipt — 수입검사 작성 권한으로도 열린다(gui.py) -->
<script type="text/x-tmpl" id="digFormMatInSearchTemplate">
<div class="content_wrap popup p-2">
    <section class="pt-0">
        <div class="table_box search mb-2">
            <form autocomplete="off">
                <div class="row">
                    <div class="col-xl-6 col-lg-6 col-md-12">
                        <div class="d-flex align-items-center">
                            <label class="form-label" data-labelCd="입고일">입고일</label>
                            <input class="form-control date tac" type="text" id="popMatInDate" />
                        </div>
                    </div>
                    <div class="col-xl-6 col-lg-6 col-md-12">
                        <div class="d-flex justify-content-between align-items-center">
                            <label class="form-label" data-labelCd="입고번호/품목">입고번호/품목</label>
                            <input type="text" class="form-control" id="popMatInKeyword" />
                            <button type="button" class="col-auto-flex btn btn-search" id="btnPopMatInSearch" data-commonCd="조회">조회</button>
                        </div>
                    </div>
                </div>
            </form>
        </div>
        <div class="grid-table-radius mb-2">
            <div id="digFormMatInSearchGrid"></div>
        </div>
    </section>
    <section class="popupcontent">
        <div class="d-flex justify-content-end flex-wrap gap-1">
            <button type="button" class="btn btn-band" id="btnPopMatInSelect" data-commonCd="선택">선택</button>
            <button type="button" class="btn btn-dell" id="btnPopMatInClose" data-commonCd="닫기">닫기</button>
        </div>
    </section>
</div>
</script>
<script type="text/javascript">
    // 자재입고 검색 팝업 — 입고일 기간·입고번호로 검색, 더블클릭 또는 [선택]으로 콜백 (WO 검색 팝업과 같은 구성)
    class DigFormMatInSearchPopup {
        constructor() {
            this.title = '자재입고 검색';
            this.grid = null;
            this.modalContainer = null;
        }

        show(keyword, callback) {
            let _this = this;
            _this.callback = callback;
            _this.modalContainer = new PopupDraggable(_this.title);
            let $content = $(tmpl('digFormMatInSearchTemplate', {}));
            _this.modalContainer.open({ width: Math.min(900, document.documentElement.clientWidth - 32), height: 520, $content });
            _this.$content = $content;
            $content.find('#popMatInKeyword').val(keyword || '');

            _this.grid = WeZonGrid.create($content.find('#digFormMatInSearchGrid')[0], {
                columnLayout: [
                    { dataField: 'receipt_number', headerText: '입고번호', width: 140, align: 'left' },
                    { dataField: 'receipt_date', headerText: '입고일', width: 100, align: 'center' },
                    { dataField: 'mat_code', headerText: '품목코드', width: 110, align: 'left' },
                    { dataField: 'mat_name', headerText: '품목명', width: 200, align: 'left' },
                    { dataField: 'qty', headerText: '수량', width: 70, align: 'right' },
                    { dataField: 'supplier_name', headerText: '공급사', width: 130, align: 'left' },
                ],
                props: { selectionMode: 'singleRow', enableSorting: true, enablePaging: true, height: 300 }
            });
            // WeZonGrid 더블클릭 이벤트 이름 = cellDoubleClick (wezongrid.js emit)
            _this.grid.on('cellDoubleClick', function (e) {
                if (e.item && e.item.receipt_number) _this.select(e.item);
            });

            $content.find('#popMatInDate').daterangepicker({
                parentEl: _this.modalContainer.$modal,
                // 입고일은 입고 예정일이라 앞뒤 30일을 본다
                startDate: moment().subtract(30, 'days'),
                endDate: moment().add(30, 'days'),
                locale: { format: 'YYYY-MM-DD', separator: ' ~ ', applyLabel: '적용', cancelLabel: '취소' }
            });
            $content.find('#btnPopMatInSearch').click(function () { _this.search(); });
            $content.find('#popMatInKeyword').keypress(function (e) {
                if (e.which === 13) { e.preventDefault(); _this.search(); }
            });
            $content.find('#btnPopMatInSelect').click(function () {
                let items = _this.grid.getSelectedItems();
                if (items.length) _this.select(items[0]);
            });
            $content.find('#btnPopMatInClose').click(function () { _this.close(); });
            _this.search();
        }

        // 검사 대상 입고만, 한 번에 100건까지(입고일 최신순)
        search() {
            const _this = this;
            const picker = this.$content.find('#popMatInDate').data('daterangepicker');
            const params = {
                action: 'list', target_only: 'Y', page: 1, page_size: 100,
                keyword: this.$content.find('#popMatInKeyword').val() || '',
                date_from: picker ? picker.startDate.format('YYYY-MM-DD') : '',
                date_to: picker ? picker.endDate.format('YYYY-MM-DD') : ''
            };
            AjaxUtil.getAsyncData('/api/definition/receipt', params, function (res) {
                if (!res || res.success === false) { _this.grid.setData([]); return; }
                _this.grid.setData((res.rows || []).map(function (r) {
                    return { receipt_number: r.receipt_no, receipt_date: r.receipt_date, mat_code: r.item_code, mat_name: r.item_name,
                             qty: r.qty, supplier_name: r.vendor_name };
                }));
            });
        }

        select(item) {
            if (this.callback) this.callback(item);
            this.close();
        }

        close() {
            this.modalContainer.close();
        }
    }
</script>
