<!-- WO 검색 팝업 — 수입·품질검사목록 작성·조회가 include 로 함께 사용
     사용: new DigFormWoSearchPopup().show(키워드, function (item) { item.work_order_number … })
     임시 데이터: 이미 작성된 작성건의 WO (API wo_list). 작업지시 엑셀 업로드가 생기면 API 데이터 출처만 교체 -->
<script type="text/x-tmpl" id="digFormWoSearchTemplate">
<div class="content_wrap popup p-2">
    <section class="pt-0">
        <div class="table_box search mb-2">
            <form autocomplete="off">
                <div class="row">
                    <div class="col-xl-6 col-lg-6 col-md-12">
                        <div class="d-flex align-items-center">
                            <label class="form-label" data-labelCd="작성일">작성일</label>
                            <input class="form-control date tac" type="text" id="popWoWriteDate" />
                        </div>
                    </div>
                    <div class="col-xl-6 col-lg-6 col-md-12">
                        <div class="d-flex justify-content-between align-items-center">
                            <label class="form-label" data-labelCd="WO">WO</label>
                            <input type="text" class="form-control" id="popWoKeyword" />
                            <button type="button" class="col-auto-flex btn btn-search" id="btnPopWoSearch" data-commonCd="조회">조회</button>
                        </div>
                    </div>
                </div>
            </form>
        </div>
        <div class="grid-table-radius mb-2">
            <div id="digFormWoSearchGrid"></div>
        </div>
    </section>
    <section class="popupcontent">
        <div class="d-flex justify-content-end flex-wrap gap-1">
            <button type="button" class="btn btn-band" id="btnPopWoSelect" data-commonCd="선택">선택</button>
            <button type="button" class="btn btn-dell" id="btnPopWoClose" data-commonCd="닫기">닫기</button>
        </div>
    </section>
</div>
</script>
<script type="text/javascript">
    // WO 검색 팝업 — WO를 기간·키워드로 검색, 더블클릭 또는 [선택]으로 콜백 (작성건 조회 팝업과 같은 구성)
    class DigFormWoSearchPopup {
        constructor() {
            this.title = 'WO 검색';
            this.url = '/api/dig_form/dig_form';
            this.grid = null;
            this.modalContainer = null;
        }

        show(keyword, callback) {
            let _this = this;
            _this.callback = callback;
            _this.modalContainer = new PopupDraggable(_this.title);
            let $content = $(tmpl('digFormWoSearchTemplate', {}));
            _this.modalContainer.open({ width: 800, height: 520, $content });
            _this.$content = $content;
            $content.find('#popWoKeyword').val(keyword || '');

            _this.grid = WeZonGrid.create($content.find('#digFormWoSearchGrid')[0], {
                columnLayout: [
                    { dataField: 'work_order_number', headerText: 'WO', width: 160, align: 'left' },
                    { dataField: 'last_write_date', headerText: '최근 작성일', width: 110, align: 'center' },
                    { dataField: 'result_count', headerText: '작성건', width: 70, align: 'right' },
                    { dataField: 'form_titles', headerText: '양식', width: 360, align: 'left' },
                ],
                props: { selectionMode: 'singleRow', enableSorting: true, enablePaging: true, height: 300 }
            });
            // WeZonGrid 더블클릭 이벤트 이름 = cellDoubleClick (wezongrid.js emit)
            _this.grid.on('cellDoubleClick', function (e) {
                if (e.item && e.item.work_order_number) _this.select(e.item);
            });

            $content.find('#popWoWriteDate').daterangepicker({
                parentEl: _this.modalContainer.$modal,
                startDate: moment().subtract(30, 'days'),
                endDate: moment(),
                locale: { format: 'YYYY-MM-DD', separator: ' ~ ', applyLabel: '적용', cancelLabel: '취소' }
            });
            $content.find('#btnPopWoSearch').click(function () { _this.search(); });
            $content.find('#popWoKeyword').keypress(function (e) {
                if (e.which === 13) { e.preventDefault(); _this.search(); }
            });
            $content.find('#btnPopWoSelect').click(function () {
                let items = _this.grid.getSelectedItems();
                if (items.length) _this.select(items[0]);
            });
            $content.find('#btnPopWoClose').click(function () { _this.close(); });
            _this.search();
        }

        search() {
            let _this = this;
            let picker = _this.$content.find('#popWoWriteDate').data('daterangepicker');
            AjaxUtil.getAsyncData(_this.url, {
                action: 'wo_list',
                date_from: picker.startDate.format('YYYY-MM-DD'),
                date_to: picker.endDate.format('YYYY-MM-DD'),
                keyword: _this.$content.find('#popWoKeyword').val(),
            }, function (result) {
                _this.grid.setData(result || []);
            });
        }

        select(item) {
            if (this.callback) this.callback(item);
            this.close();
        }

        close() {
            this.modalContainer.close();
        }
    }
</script>
