# Wezard 관리자 화면 — ai-api.yest.co.kr 을 GPU 서버 172.16.10.6:8000 으로 넘긴다. /etc/nginx/conf.d/ai-api.conf 로 복사한다(00-default.conf 필요)
# 제조AI플랫폼 ↔ Wezard 연동은 이 주소를 쓰지 않는다(서버끼리 직접 — DEPLOYMENT §8)
server {
    listen 80;
    listen [::]:80;
    server_name ai-api.yest.co.kr;
    server_tokens off;

    set_real_ip_from 10.0.0.0/16;   # ALB 대역만 믿는다 — 아래 allow 가 실제 접속 PC 주소로 판정된다
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # 관리자 PC(공인 IP)만 연다. 사용처가 늘면 allow 줄을 더하고 다시 읽는다(nginx -s reload)
    allow 61.40.239.178/32;   # 위존 사무실
    deny all;

    client_max_body_size 10240m;   # Wezard DATASET_UPLOAD_MAX_MB 기본값 — 상한은 Wezard 가 판정한다
    proxy_request_buffering off;   # 큰 업로드를 / 디스크(/var/lib/nginx)에 쌓지 않고 바로 넘긴다

    location / {
        proxy_pass http://172.16.10.6:8000;
        proxy_read_timeout 120s;
        proxy_set_header Host              $host;   # Wezard 허용 호스트에 ai-api.yest.co.kr 이 있어야 한다
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    # Wezard 공개 API(모델·추론·chat)는 Wezard 가 제조AI플랫폼 서버 IP 에만 여는 경로다. 이 주소로 넘기면 Wezard 에는
    # 이 서버(10.0.10.6)에서 온 요청으로 보여 그 제한이 풀린다 — 제조AI플랫폼은 Wezard 에 직접 붙으므로 여기서는 막는다
    location /api/v1 {
        deny all;
    }
}
