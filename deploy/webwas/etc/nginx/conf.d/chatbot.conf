# 지능형 작업표준 안내 AI(Chatbot) — chatbot.yest.co.kr. /etc/nginx/conf.d/chatbot.conf 로 복사한다(root 644).
# MAIP 의 00-default.conf(기본 server·$forwarded_proto)가 함께 있어야 한다. MAIP 저장소 scripts/nginx/chatbot.conf 초안을 대체한다
# — 바꾸기 전에 MAIP 담당에게 알린다. 설명: docs/design/운영배포_가이드_서버별_v1.1.md §4.3 ⑪
server {
    listen 80;
    listen [::]:80;
    server_name chatbot.yest.co.kr;
    server_tokens off;

    # ALB 대역에서 온 X-Forwarded-For 만 믿는다(maip.conf 와 같다)
    set_real_ip_from 10.0.0.0/16;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # 프런트 빌드 결과. nginx 는 ACL 로 이 폴더만 읽는다(backend 소스·.env 는 못 읽는다)
    root /opt/yest/chatbot/frontend;

    # 엑셀·이미지 업로드 한 요청 — RESOURCE_MAX_UPLOAD_BYTES(50MB)보다 크게. 상한은 앱이 판정한다
    client_max_body_size 60m;

    # 빌드 파일(이름에 해시)은 오래 캐시하고 index.html 은 매번 확인한다 — 배포 뒤 옛 화면이 남지 않게
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
    # Vue Router history 모드 — 없는 경로는 index.html 로
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_buffering off;          # 답변 스트리밍(/api/query/stream)을 모아 두지 않고 바로 넘긴다
        proxy_cache off;
        proxy_read_timeout 300s;      # LLM 답변·엑셀 등록. ALB 유휴 시간 제한도 같이 늘린다
        proxy_send_timeout 300s;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    # docling-parser 가 결과를 밀어 넣는 경로(/internal/...). 운영은 RESOURCE_DELIVERY=pull 이라 밖에서 열 일이 없다
    location /internal/ {
        return 404;
    }
}
