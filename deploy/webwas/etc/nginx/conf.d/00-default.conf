# Web/WAS 서버 nginx 공통 — 서비스 server(maip·chatbot·ai-api.conf)보다 먼저 읽히게 00- 로 둔다. 설명: docs/DEPLOYMENT.md §4
# /etc/nginx/conf.d/00-default.conf 로 복사한다. Rocky 기본 /etc/nginx/nginx.conf 의 80 server 블록은 지운다(default_server 가 둘이면 nginx -t 실패).

# ALB 주소(55자)가 기본 칸(64)에 들어가지 않아 nginx -t 가 실패한다
server_names_hash_bucket_size 128;

# 사용자가 ALB 에 붙은 원래 스킴 — ALB 가 넘긴 X-Forwarded-Proto, 없으면 nginx 가 받은 스킴(http).
# 서비스 server 는 X-Forwarded-Proto 로 $scheme 이 아니라 이 값을 넘긴다 — https 로 들어와도 서버는 http 를 받는다
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

# 기본 server — 서비스 이름이 아닌 Host. ALB 헬스체크(Host 가 서버 IP)와 아무 Host 로 찌르는 요청이 여기로 온다
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    server_tokens off;
    location = /lb-health { access_log off; return 200 "ok\n"; }   # ALB 헬스체크 경로
    location = / { access_log off; return 200 "ok\n"; }            # 헬스체크가 GET / 로 오는 경우
    location / { return 444; }                                     # 그 밖은 응답 없이 끊는다 — 앱 로그에 DisallowedHost 가 쌓이지 않는다
}
