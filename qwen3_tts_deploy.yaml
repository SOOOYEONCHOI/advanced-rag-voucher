# Qwen3-TTS deploy config (vllm_omni/deploy/qwen3_tts.yaml 기반)
# 변경점: GPU 0을 ASR 등과 공유하므로 stage별 gpu_memory_utilization 0.3 -> 0.12, max_num_seqs 64 -> 8.
# OOM/KV cache 부족 로그가 나오면 gpu_memory_utilization을 올린다(stage 0 + stage 1 합계가 실제 점유율).
model_runner: v2
async_chunk: true

connectors:
  connector_of_shared_memory:
    name: SharedMemoryConnector
    extra:
      talker_first_audio: true
      codec_streaming: true
      connector_get_sleep_s: 0.01
      connector_get_max_wait_first_chunk: 3000
      connector_get_max_wait: 300
      codec_chunk_frames: 25
      codec_left_context_frames: 72
      initial_codec_chunk_frames: 1
      decode_batch_max_size: 4

stages:
  # stage 0: talker (텍스트 -> 음성 코덱 토큰)
  - stage_id: 0
    max_num_seqs: 8
    gpu_memory_utilization: 0.12
    trust_remote_code: true
    enable_prefix_caching: false
    async_scheduling: true
    max_num_batched_tokens: 512
    max_model_len: 4096
    devices: "0"
    output_connectors:
      to_stage_1: connector_of_shared_memory
    default_sampling_params:
      temperature: 0.9
      top_k: 50
      max_tokens: 4096
      min_tokens: 2
      repetition_penalty: 1.05
    silence_ban_frames: 0
    subtalker_sampling_params:
      do_sample: true
      temperature: 0.9
      top_k: 50
      top_p: 1.0

  # stage 1: codec decoder (코덱 토큰 -> 24kHz 파형)
  - stage_id: 1
    dtype: bfloat16
    max_num_seqs: 8
    gpu_memory_utilization: 0.12
    enforce_eager: false
    trust_remote_code: true
    enable_prefix_caching: false
    async_scheduling: true
    max_num_batched_tokens: 65536
    max_model_len: 65536
    devices: "0"
    input_connectors:
      from_stage_0: connector_of_shared_memory
    default_sampling_params:
      temperature: 0.0
      top_p: 1.0
      top_k: -1
      max_tokens: 65536
      repetition_penalty: 1.0
