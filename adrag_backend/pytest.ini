[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
asyncio_mode = auto
log_cli = true
log_cli_level = INFO
markers =
    e2e: calls a running backend and may require explicit mutation opt-in
    voice: calls a running voice model server and requires VOICE_ASR_E2E_AUDIO_PATH
