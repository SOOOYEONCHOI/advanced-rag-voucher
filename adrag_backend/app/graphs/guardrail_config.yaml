# 가드레일 규칙 설정 파일
# intent 분류 기준 및 사전 정의 응답 템플릿 관리
# 서버 재시작 없이 수정하려면 lru_cache를 제거하거나 서버를 재시작하세요.

# ── 인사말 패턴 ──────────────────────────────────────────────
# 구두점 제거 후 정확히 일치하는 경우만 greeting으로 판별합니다.
# 인사말 뒤에 질문이 이어지는 경우(예: "안녕, 작업허가서 절차는?")는
# LLM fallback에서 rag_query로 분류됩니다.
greeting_patterns:
  - "안녕"
  - "안녕하세요"
  - "안녕하십니까"
  - "안녕히 계세요"
  - "안녕히계세요"
  - "하이"
  - "헬로"
  - "hello"
  - "hi"
  - "반가워"
  - "반갑습니다"
  - "반가워요"
  - "고마워"
  - "고맙습니다"
  - "감사합니다"
  - "감사해요"
  - "감사"
  - "수고하세요"
  - "수고해"
  - "수고하십시오"
  - "잘 있어"
  - "잘있어"
  - "bye"
  - "굿모닝"
  - "good morning"
  - "good afternoon"
  - "good evening"

# ── 무의미한 입력 패턴 (정규식) ──────────────────────────────
# validate_input을 통과했지만 의미 없는 문자열을 걸러냅니다.
empty_or_invalid_patterns:
  - "^[ㄱ-ㅎㅏ-ㅣ]+$"        # 자음·모음만 (예: ㅋㅋ, ㄱㄱ, ㅎㅎㅎ)
  - "^[a-zA-Z]{1,2}$"         # 1~2자 알파벳 단독 (예: a, ok, hi — hi는 greeting과 중복이나 순서상 무해)
  - "^[\\W\\s]+$"              # 특수문자·공백만 (예: !!!, ???, ...)
  - "^(.)\\1{2,}$"             # 같은 문자 3회 이상 반복 (예: aaa, ㅋㅋㅋ, 히히히)

# ── 금지 키워드 ──────────────────────────────────────────────
# 이 중 하나라도 질의에 포함되면 unsafe로 판별합니다. (대소문자 무시)
unsafe_keywords:
  - "비밀번호"
  - "패스워드"
  - "password"
  - "주민번호"
  - "주민등록번호"
  - "신용카드번호"
  - "카드번호"
  - "계좌번호"
  - "관리자 계정"
  - "admin 계정"
  - "root 계정"
  - "해킹"
  - "크래킹"
  - "sql injection"
  - "sql 인젝션"
  - "xss"
  - "exploit"
  - "취약점 공격"

# ── 업무 키워드 (rag_query 즉시 통과) ─────────────────────────
# 2026.11.04(sooyeon.choi) 추가 - 조립 작업표준 용어가 포함되면 LLM 분류 없이 rag_query로 처리
# 금지 키워드·무의미 입력·인사말 판별 뒤에 적용하므로 금지 키워드가 함께 있으면 unsafe가 우선합니다.
# 끄려면 rag_keywords_enabled를 false로 바꾸세요. (대소문자 무시, 부분 일치)
rag_keywords_enabled: true
rag_keywords:
  - "부품"
  - "자재"
  - "조립"
  - "공정"
  - "작업"
  - "절차"
  - "순서"
  - "단계"
  - "표준"
  - "sop"
  - "체결"
  - "토크"
  - "볼트"
  - "너트"
  - "나사"
  - "공구"
  - "지그"
  - "규격"
  - "사양"
  - "치수"
  - "검사"
  - "모델"
  - "품번"
  - "도면"
  - "dxf"
  - "사진"
  - "이미지"
  # 2026.11.11 추가 - 산업안전(PDF) 문서 질의 즉시 통과
  - "재해"
  - "산업안전"
  - "안전보건"
  - "사업주"
  - "근로자"
  - "보호구"
  - "법령"
  - "시행령"
  - "시행규칙"

# ── 사용자 응답 유형 매핑 ────────────────────────────────────
# 실제 문구는 app.core.user_messages에서 관리합니다.
response_types:
  smalltalk: out_of_scope
  irrelevant: out_of_scope
  unsafe: security_blocked
  empty_or_invalid: invalid_question
