# 2026.11.12(sooyeon.choi) 도면 파싱 기능 추가 - 도면 양식 템플릿·키워드 사전
# 코드 변경 없이 양식을 더할 수 있도록 표제란 라벨·표 머리글 별칭·제외 문구를 여기에 둔다.
# 좌표는 모두 도면 범위 기준 정규화 좌표(0~1, 왼쪽 아래가 0,0).

templates:
  # 사내 SolidWorks A3 표제란 양식(샘플 3종 공통). 값이 라벨 아래 칸에 있다.
  # TODO(결정필요: 실제 샘플로 표제란 영역·값 방향을 보정 — 지금 값은 오른쪽 아래 영역 기준 추정)
  - name: yest_a3_v1
    title_region: [0.55, 0.0, 1.0, 0.22]   # [x0, y0, x1, y1]
    value_direction: below
    min_label_ratio: 0.5

# 표제란 필드 라벨(대소문자·공백·밑줄 무시). 긴 별칭부터 맞춘다.
title_fields:
  part_no: ["PART NUMBER", "PART NO", "PART_NUMBER", "DWG NO", "DRAWING NO", "DRAWING NUMBER", "품번", "도번", "도면번호"]
  part_name: ["PART NAME", "PART_NAME", "DESCRIPTION", "TITLE", "품명", "도명", "명칭"]
  revision: ["REVISION", "REV", "REV.", "개정", "개정번호"]
  date: ["DATE", "일자", "작성일"]
  scale: ["SCALE", "척도", "축척"]
  material: ["MATERIAL", "재질"]
  material_group: ["MATERIAL GROUP", "MATERIAL_GROUP", "재질그룹"]
  after_treatment: ["AFTER TREATMENT", "AFTER_TREATMENT", "후처리"]
  part_spec: ["PART SPEC", "PART_SPEC", "SPEC", "사양", "규격"]
  drawn: ["DRAWN", "DRAWN BY", "DESIGNED", "작성", "작성자", "설계"]
  checked: ["CHECKED", "CHECK", "검토", "검도"]
  approved: ["APPROVED", "APPR", "승인"]
  units: ["UNIT", "UNITS", "단위"]
  sheet: ["SHEET", "매수"]

required_fields: [part_no, part_name, revision]

# 표 머리글 별칭(원본 오타도 별칭으로 둔다: PART_NAMBER)
tables:
  bom:
    item_no: ["NO", "ITEM", "ITEM NO", "번호", "품번호"]
    revision: ["REVISION", "REV"]
    part_no: ["PART NUMBER", "PART_NUMBER", "PART_NAMBER", "PART NO", "품번", "도번"]
    part_name: ["PTC_WM_PART_NAME", "PART NAME", "PART_NAME", "DESCRIPTION", "품명", "명칭"]
    qty: ["Q'TY", "QTY", "QUANTITY", "수량"]
    material: ["MATERIAL", "재질"]
    material_group: ["MATERIAL_GROUP", "MATERIAL GROUP", "재질그룹"]
    part_spec: ["PART_SPEC", "PART SPEC", "SPEC", "사양", "규격"]
    after_treatment: ["AFTER_TREATMENT", "AFTER TREATMENT", "후처리"]
  revision:
    rev: ["REV", "REVISION", "NO", "개정"]
    description: ["DESCRIPTION", "DESC", "CHANGE", "내용", "개정내용", "변경내용"]
    date: ["DATE", "일자"]
    drawn: ["DRAWN", "BY", "작성"]
    checked: ["CHECKED", "APPROVED", "검토", "승인"]
  # 표 종류 판정에 꼭 있어야 하는 열
  required:
    bom: [part_no, qty]
    revision: [description, date]

notes:
  headings: ["NOTES", "NOTE", "주기", "주 기", "비고"]
  general_tolerance: '(KS\s*B\s*ISO\s*2768\s*-?\s*[a-zA-Z](?:\s*/\s*[A-Z])?|ISO\s*2768\s*-?\s*[a-zA-Z](?:\s*/\s*[A-Z])?)'
  spec_memo: '<[^<>]*규격\s*:[^<>]*>'

# 양식에 항상 있는 문구 — 기타 글자에서 뺀다
exclude:
  patterns:
    - '^CONFIDENTIAL$'
    - '^(정밀급|보통급|판금|일반공차|일반 공차)$'
    - '^(초과|이하|이상|미만)$'
    - '^\d+(\.\d+)?\s*(초과|이하|이상)'
    - '^±\s*\d+(\.\d+)?$'
  confidential: '^CONFIDENTIAL$'
