# Alembic config (2026-09-29, Phase 1.5 PostgreSQL schema management)
# Keep this file ASCII-only: Windows reads it with the locale codepage.
# Connection info is NOT stored here; migrations/env.py reads POSTGRES_* / DATABASE_URL from app settings.
#
# Usage (run in adrag_backend/):
#   alembic upgrade head      # apply latest schema
#   alembic downgrade base    # revert all
#   alembic current           # show current revision

# Database migration tool configuration file

[alembic]
script_location = migrations
prepend_sys_path = .
version_path_separator = os
path_separator = os
output_encoding = utf-8

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
